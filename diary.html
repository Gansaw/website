<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary | HoJin Choi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 날짜 그룹 헤더 */
        .diary-month-header {
            grid-column: 1 / -1;
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-color);
            padding: 0.5rem 0 0.25rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: -0.5rem;
            letter-spacing: 0.04em;
        }

        /* 일기 카드 — 날짜 강조 */
        .diary-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            width: 320px;
            flex-shrink: 0;
        }
        .diary-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--accent-color); }

        .diary-date-badge {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            padding: 1rem 1.5rem 0.75rem;
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }
        .diary-day   { font-size: 2rem; font-weight: 800; color: #e0f2fe; line-height: 1; }
        .diary-month-year { font-size: 0.85rem; color: #93c5fd; font-weight: 500; }
        .diary-weekday { font-size: 0.78rem; color: #60a5fa; margin-left: auto; }

        .diary-body  { padding: 1.25rem 1.5rem; flex-grow: 1; }
        .diary-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
        .diary-excerpt { font-size: 0.9rem; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        /* mood 배지 */
        .mood-badge {
            display: inline-block;
            padding: 0.2rem 0.65rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .mood-great  { background: rgba(16,185,129,0.2); color:#34d399; }
        .mood-good   { background: rgba(59,130,246,0.2); color:#60a5fa; }
        .mood-okay   { background: rgba(245,158,11,0.2); color:#fbbf24; }
        .mood-tough  { background: rgba(239,68,68,0.2);  color:#f87171; }

        /* wm-hint */
        .wm-hint { font-size:0.8rem; color:#475569; margin-top:0.4rem; }

        /* 달력 날짜 입력 */
        input[type="date"].wm-input { color-scheme: dark; }
    </style>
</head>
<body>

<!-- 리스트 뷰 -->
<div id="listView" style="padding-top:0;">
    <div class="page-hero">
        <h1>Diary</h1>
        <p>하루하루의 기록, 생각, 감정</p>
    </div>
    <div style="display:flex; justify-content:center; gap:0.75rem; padding:0.75rem 1rem 0; flex-wrap:wrap;">
        <a href="index.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">← Home</a>
        <a href="study.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Study</a>
        <a href="project.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Project</a>
        <a href="article.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Article</a>
        <a href="certificate.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Certificate</a>
        <a href="goal.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Goal</a>
    </div>
    <div id="diaryGrid" style="display:flex; flex-wrap:wrap; justify-content:center; gap:2rem; max-width:1200px; margin:1.5rem auto 4rem; padding:0 1.5rem;"></div>
</div>

<!-- 디테일 뷰 -->
<div id="detailView">
    <button class="back-btn" onclick="backToList()">← 목록으로</button>
    <div id="detailContent"></div>
</div>

<!-- 글쓰기/수정 모달 -->
<div class="write-overlay" id="writeOverlay">
    <div class="write-modal">
        <div class="write-modal-header">
            <h2 id="writeModalTitle">📔 새 일기 작성</h2>
            <button class="write-modal-close" onclick="closeWrite()">&#10005;</button>
        </div>

        <label class="wm-label">날짜 *</label>
        <input id="dDate" type="date" class="wm-input">

        <div class="wm-row">
            <div>
                <label class="wm-label">제목 *</label>
                <input id="dTitle" type="text" class="wm-input" placeholder="오늘 하루를 한 문장으로...">
            </div>
            <div>
                <label class="wm-label">기분</label>
                <select id="dMood" class="wm-select">
                    <option value="great">😄 Great</option>
                    <option value="good">🙂 Good</option>
                    <option value="okay">😐 Okay</option>
                    <option value="tough">😔 Tough</option>
                </select>
            </div>
        </div>

        <label class="wm-label">요약 (카드 미리보기) *</label>
        <textarea id="dExcerpt" class="wm-textarea" rows="2" placeholder="오늘 있었던 일을 2~3줄로..."></textarea>

        <!-- Quill 에디터 -->
        <label class="wm-label">본문 * <span style="font-weight:400; color:#475569; text-transform:none; letter-spacing:0;">(시각적 편집)</span></label>
        <div class="editor-container">
            <div id="dBodyEditor" style="background:#1e293b; border-radius:8px;"></div>
        </div>

        <button class="wm-submit" id="publishBtn" onclick="publishDiary()">📤 GitHub에 등록</button>
    </div>
</div>

<!-- 토큰 설정 모달 -->
<div class="write-overlay" id="tokenOverlay">
    <div class="write-modal" style="max-width:480px;">
        <div class="write-modal-header">
            <h2>🔑 GitHub Token 설정</h2>
            <button class="write-modal-close" onclick="closeTokenModal()">&#10005;</button>
        </div>
        <p style="font-size:0.9rem; color:#94a3b8; margin-bottom:1.5rem; line-height:1.6;">
            GitHub에 일기를 저장하려면 Personal Access Token이 필요합니다.<br>
            토큰은 이 브라우저에만 저장되며 외부로 전송되지 않습니다.
        </p>
        <label class="wm-label">Personal Access Token
            <a href="https://github.com/settings/tokens/new?scopes=repo&description=portfolio-write"
               target="_blank"
               style="font-weight:400; color:#60a5fa; text-transform:none; letter-spacing:0; margin-left:0.5rem;">
               발급하러 가기 →
            </a>
        </label>
        <input id="tokenInput" type="password" class="wm-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        <p class="wm-hint">repo 권한 체크 후 발급 · 페이지를 닫아도 유지됩니다</p>
        <button class="wm-submit" onclick="saveToken()">💾 저장</button>
        <button onclick="clearToken()" style="width:100%; margin-top:0.6rem; padding:0.6rem; background:transparent; border:1px solid #334155; border-radius:8px; color:#64748b; font-family:inherit; font-size:0.85rem; cursor:pointer;">
            저장된 토큰 삭제
        </button>
    </div>
</div>

<!-- FAB 그룹 -->
<div class="fab-group">
    <button class="fab fab-token" onclick="openTokenModal()" title="GitHub Token 설정">🔑</button>
    <button class="fab fab-write" onclick="openWrite()" title="새 일기 작성">📔</button>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<!-- 데이터 저장 영역 -->
<!--__DIARY_DATA_START__
[{"id":"d1776607619880","entryDate":"2026-04-15","title":"2026년 4월 15일 Diary","mood":"okay","excerpt":"업무 후 친구랑 게임을 했음","body":"<p>오늘은 내가 즐겨 하는 로스트아크 게임 레이드 초기화 날이다.</p><p>따라서 퇴근 후 친구랑 게임을 하고 놀았다.</p><p>내일부터는 일도 열심히 하고 하고 있는 공부도 열심히 해야겠다.</p><p>내일은 비도 오지 않으니 퇴근하고 테마 공원에 가서 운동도 할 예정이다.</p><p>-----------------------------------------------------------------------------------------------------------------------------</p><p>Today is the weekly reset day for raids in Lost Ark, one of my favorite games. </p><p>So after work, I hung out and played with a friend. </p><p>Starting tomorrow, I need to buckle down on both work and the studies I've been doing. </p><p>It's not supposed to rain tomorrow either, so I'm planning to go to the theme park after work and get some exercise.</p>"},{"id":"d1776009989566","entryDate":"2026-04-13","title":"2026년 4월 13일 Diary","mood":"good","excerpt":"일기가 잘 써지지 않음 \n부모님과 생선 정식을 먹었음 \n사천에 도착 후 집에서 쉬었음","body":"<p>금요일에 친구랑 같이 술을 마시고 즐겁게 놀았다.</p><p>그리고 토요일에 일어나고 집에서 쉬었다. 이제 일요일이 되서 일기를 오랜만에 작성을 해본다.</p><p>오늘은 마산에서 사천으로 돌아가는 날이다. 월요일부터 다시 즐겁게 일을 해야하기 때문이다.</p><p>점심 때 어시장에 있는 생선구이 집에 가서 부모님과 생선 정식을 먹었다. 가격에 비해 맛이 좋았다.</p><p>5시 반 쯤 사천에 있는 자취방에 도착하고 나서 친구랑 로스트아크를 즐겼다.</p><p>이후에는 Coursera에 있는 IBM Engineering 과정을 수강하였다.</p><p>4월 14일까지 Coursera를 이용할 수 있어서 내일은 운동이 힘들 수도 있겠다.</p><p>화요일에는 꼭 운동을 해야지...</p><p>-----------------------------------------------------------------------------------------------------------------------------</p><p>I had a great time drinking and hanging out with my friend last Friday. After taking a good rest at home on Saturday, I’m finally sitting down to write in my diary after a long time.</p><p>Today is the day I head back to Sacheon from Masan. I need to get back so I can start work refreshed and ready on Monday.</p><p>For lunch, I went to a grilled fish restaurant at the Fish Market with my parents. We had the fish set menu, and it was surprisingly delicious for such a reasonable price.</p><p>I arrived at my place in Sacheon around 5:30 PM and spent some time playing <strong>Lost Ark</strong> with a friend. After that, I focused on my studies, specifically the <strong>IBM Engineering course on Coursera</strong>.</p><p>Since my Coursera subscription expires on April 14th, I might have to skip my workout tomorrow to finish the course. I'll make sure to hit the gym on Tuesday for sure!</p>"},{"id":"d1774799889579","entryDate":"2026-03-30","title":"2026년 3월 30일 Diary","mood":"great","excerpt":"오랜만에 노래방에 가서 가요와 팝송을 들었음\n그리고 Coursera의 교육과정 수료를 완료하였음","body":"<p>평상시에는 낮에 일하고 퇴근 후 집에서 쉬는 삶를 반복하다 보니 일기에 어떤 것을 쓸 지 잘 몰라서 따로 작성하지 않았다. 오늘은 평소와 다른 하루를 보낸 것 같아 일기를 오랜만에 작성을 해본다.</p><p><br></p><p>낮에는 혼자서 동전노래방에 가서 여러 노래를 불렀다. 30분 불렀고 요금은 3000원이었다. 요즘 마이클 잭슨 노래를 많이 듣고 있어서 노래방에서 마이클 잭슨 노래를 몇 곡 불렀다. 오랜만에 불러서 그런지 목소리가 잘 나오지 않았다. 그래도 스트레스를 해소할 수 있어서  좋았다.</p><p><br></p><p>노래방에 갔다 온 후 컴퓨터를 키고 Coursera에 접속한 후 수강 중인 강의를 모두 듣고 수료증을 받게 되었다. Generative AI for Digital Marketing 이라는 과정이고 다양한 산업에서의 AI 활용 전략 및 사례에 대해 소개하는 내용이었다. 실무적인 내용은 부족했으나, 다양한 관점에서의 AI 사용 방안 등을 알아볼 수 있어서 보람찬 결과를 얻었다고 생각했다.</p><p><br></p><p>다음은 IBM AI Engineering이라는 과정을 수료하고자 하는 목표를 가지고 있다. 이 과정은 Pytorch를 활용한 다양한 AI 실무 능력을 기르는 데 목적을 두고 있다. 따라서 나에게 있어서 가장 필요한 과정이라고 생각하고 열심히 수강할 예정이다.</p><p><br></p><p>-----------------------------------------------------------------------------------------------------------------------------</p><p><br></p><p>It has been a while since I last wrote a diary entry. On ordinary days, life tends to follow the same routine — work during the day, rest at home in the evening — so I rarely feel like I have much to write about. But today felt a little different, so here I am.</p><p><br></p><p>In the afternoon, I went to a coin karaoke by myself and sang for about 30 minutes, which only cost me 3,000 won. Lately I've been listening to a lot of Michael Jackson, so I sang a few of his songs. Since it had been so long since I last sang, my voice wasn't in great shape, but it still felt good to let loose and blow off some steam.</p><p><br></p><p>After coming home, I sat down at my computer and finished up the remaining lectures on Coursera. I ended up completing the course and earning a certificate — the course was called <em>Generative AI for Digital Marketing</em>, and it covered various AI application strategies and case studies across different industries. The content was a bit light on hands-on, practical material, but it gave me a broader perspective on how AI can be used in many different contexts, and I felt genuinely accomplished by the end.</p><p><br></p><p>My next goal is to complete the <em>IBM AI Engineering</em> course. It focuses on building practical AI skills using PyTorch, which is exactly what I need right now. I'm planning to take it seriously and work through it diligently.</p>"},{"id":"d1774282251522","entryDate":"2026-03-23","title":"2026년 3월 23일 Diary","mood":"good","excerpt":"업무 자료를 정리하고 퇴근 후에 친구랑 놀았음","body":"<p>월요일이 다가왔다.</p><p><br></p><p>이번 주까지 해야 할 업무 내용을 정리하고 자료를 정리하였다.</p><p><br></p><p>퇴근 후에는 일본어 공부를 잠깐 하고 친구랑 놀았다. </p><p><br></p><p>오늘은 크게 쓸 내용이 없어서 여기까지만 적으려고 한다. 내일은 사천 테마파크에 가서 운동을 할 예정이다. 운동이 끝나고 나면 친구랑 같이 이야기하면서 놀아야 겠다.</p>"},{"id":"d1774188423653","entryDate":"2026-03-22","title":"2026년 3월 22일 Diary","mood":"okay","excerpt":"집에서 쉬었음","body":"<p>사실 오늘은 일기를 크게 쓸 게 없다.</p><p><br></p><p>며칠 전에 주문했던 짬뽕 밀키트를 먹고 유튜브 보면서 시간을 보냈다.</p><p>저녁 때는 친구랑 롤 두 판 정도 했다. 이후로는 그냥 쉬었다.</p><p><br></p><p>내일은 월요일이다. 출근 준비 잘 하고 피곤하지 않도록 충분한 숙면을 취해야겠다.</p>"},{"id":"d1774188167830","entryDate":"2026-03-21","title":"2026년 3월 21일 Diary","mood":"good","excerpt":"도서관에 가서 공부한 후 집에서 쉬었음","body":"<p>오늘은 첫 주말이다.</p><p><br></p><p>주말이라 쉬려고 했지만 도서관에 방문했다. 도서관에 가는 걸 습관하 하기 위해서다</p><p>.</p><p>오늘은 도서관에서 잡지를 읽었다. 항공우주산업에서의 미래 AI 기술의 활용에 관한 내용이었다.</p><p>잡지를 읽고 나서 오늘은 일찍 집에 도착했다. 집에 가서 친구랑 디스코드로 게임을 같이 했다.</p><p><br></p><p>내일은 도서관에 따로 방문은 하지 않을 예정이다. 하지만 집에서 영어와 일본어 공부는 계속할 예정이다.</p>"},{"id":"d1774112383117","entryDate":"2026-03-20","title":"2026년 3월 20일 Diary","mood":"good","excerpt":"Claude에서 알려준 시각 기법을 활용하여 데이터 시각 자료를 만들었고 퇴근 후에는 휴식을 취함","body":"<p>드디어 기다리고 기다리던 금요일이 다가왔다.</p><p><br></p><p>어제 Claude에서 알려준 시각 기법들을 적용시켜 보았다. 확실히 AI의 성능이 많이 발전했다는 것을 몸소 느끼게 되었다. 앞으로의 생존을 위해서라면 AI를 다룰 줄 아는 능력은 필수적이라고 볼 수 있다.</p><p><br></p><p>현재 데이터 분석을 주로 담당하고 있지만 나는 AI를 다룰 수 있는 능력을 가지고 있다. 비록 다른 전문가들보다는 떨어질 수도 있지만 AI를 이용하여 여러 알고리즘 개발을 진행하고 있고 실제로 몇몇 유효한 output을 얻을 수도 있었다. 이런 output을 얻는 성취감에 오늘도 즐겁게 일을 마쳤다.</p><p><br></p><p>본래 퇴근 후에는 도서관을 가려고 했으나 금요일이라 그런지 쉬고 싶어서 집에 바로 갔다. 집에 가서 서울과 일본에 있는 친구와 이야기하면서 하루를 마무리하였다.</p>"},{"id":"d1774070479179","entryDate":"2026-03-19","title":"2026년 3월 19일 Diary","mood":"great","excerpt":"업무 중 Claude 코드를 이용하여 다양한 데이터 시각화 기법을 발견하였고,  퇴근 후에는 도서관에 가서 영어, 일본어 공부를 하였음","body":"<p>오늘은 목요일이다.</p><p><br></p><p>알고리즘은 어느 정도 개발이 되었고 결과를 파악하기 위해 데이터 시각화를 진행하고 있다. 하지만 내가 작성한 코드는 복잡하고 모양이 이쁘지 않았다. 그래서 AI에게 질문을 던졌다.</p><p><br></p><p>데이터를 시각화하기 위한 좋은 방법이 없을까? 그리고 어떻게 하면 다른 사람들에게 이해하기 쉬운 자료를 보여줄 수 있을까? 지금 만드는 것 말고 다른 좋은 아이디어가 있는가?</p><p><br></p><p>나는 현재 Claude Pro를 구독 중이다. Claude에 질문을 하지 다양한 관점에서의 해결방안을 제시해 주었다. 이렇게 Claude에 많은 도움을 받아 현재 진행 중이 개발을 더욱 수월하게 할 수 있었다.</p><p><br></p><p>퇴근시간이 다가오고 KT 할인쿠폰으로 롯데리아에서 핫크리스피 버거 세트를 4000원에 구매할 수 있었다. 같이 일하는 Kim 차장님과 같이 롯데리아에 가서 함께 저녁을 먹었다. </p><p><br></p><p>저녁을 먹고 나서 도서관에 가서 같이 공부를 하였다. 현재 영어와 일본어 공부를 같이 진행하고 있다. 목표는 TOEIC 850점과 JLPT 3급이다. 직장인의 신분이라 취준생처럼 올인할 수는 없지만, 꾸준히 공부를 진행하려고 하고 있다. 사천 도서관은 시설이 아주 좋아서 앞으로도 자주 이용할 계획이다.</p><p><br></p><p>오늘 하루는 정말 알차게 잘 보낸 것 같다. 내일은 어떤 하루가 시작될 지 기대가 된다.</p>"}]
__DIARY_DATA_END__-->

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
/* ── GitHub 설정 ── */
const GH_OWNER  = 'Gansaw';
const GH_REPO   = 'website';
const GH_FILE   = 'diary.html';
const GH_BRANCH = 'main';
const TOKEN_KEY = 'gh_token_portfolio';

const DATA_START_MARKER = '<!--__DIARY_DATA_START__';
const DATA_END_MARKER   = '__DIARY_DATA_END__-->';

let DIARY = [];
let editingId = null;
let quillEditor = null;

const MOOD_EMOJI = { great:'😄', good:'🙂', okay:'😐', tough:'😔' };
const WEEKDAYS   = ['일','월','화','수','목','금','토'];

/* ════════════════════════════════════════════
   데이터 로드
════════════════════════════════════════════ */
function loadDiary() {
    try {
        const html = document.documentElement.outerHTML;
        const s = html.indexOf(DATA_START_MARKER), e = html.indexOf(DATA_END_MARKER);
        if (s !== -1 && e !== -1) DIARY = JSON.parse(html.substring(s + DATA_START_MARKER.length, e).trim());
    } catch (err) { console.error('데이터 로드 오류:', err); DIARY = []; }
}

/* ════════════════════════════════════════════
   Quill 에디터 초기화
════════════════════════════════════════════ */
function initQuillEditor() {
    if (!quillEditor) {
        quillEditor = new Quill('#dBodyEditor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    ['blockquote'],
                    [{ 'header': 2 }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'color': [] }],
                    ['link'],
                    ['clean']
                ]
            },
            placeholder: '오늘 하루를 자유롭게 기록해보세요...'
        });
    }
}

/* ════════════════════════════════════════════
   토큰 관리
════════════════════════════════════════════ */
function getToken()  { return localStorage.getItem(TOKEN_KEY) || ''; }
function saveToken() {
    const t = document.getElementById('tokenInput').value.trim();
    if (!t) { showToast('토큰을 입력해주세요.', true); return; }
    localStorage.setItem(TOKEN_KEY, t);
    closeTokenModal(); updateTokenIndicator(); showToast('✅ 토큰이 저장됐습니다.');
}
function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById('tokenInput').value = '';
    updateTokenIndicator(); showToast('🗑 토큰이 삭제됐습니다.');
}
function updateTokenIndicator() {
    document.querySelector('.fab-token').style.borderColor = getToken() ? '#10b981' : '#1e3a5f';
}
function openTokenModal() {
    document.getElementById('tokenInput').value = getToken();
    document.getElementById('tokenOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeTokenModal() {
    document.getElementById('tokenOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

/* ════════════════════════════════════════════
   GitHub API 헬퍼
════════════════════════════════════════════ */
async function ghGet(token) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`,
        { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
    );
    if (!res.ok) throw new Error(`GitHub API 오류: ${res.status} — 토큰을 확인해주세요.`);
    return res.json();
}
async function ghPut(token, sha, newContent, message) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`,
        {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(newContent))), sha, branch: GH_BRANCH })
        }
    );
    if (!res.ok) { const err = await res.json(); throw new Error(err.message || `GitHub 커밋 실패: ${res.status}`); }
    return res.json();
}
function injectJSON(fileText, newJSON) {
    const s = fileText.indexOf(DATA_START_MARKER), e = fileText.indexOf(DATA_END_MARKER);
    if (s === -1 || e === -1) throw new Error('데이터 마커를 찾을 수 없습니다.');
    return fileText.slice(0, s + DATA_START_MARKER.length) + '\n' + newJSON + '\n' + fileText.slice(e);
}

/* ════════════════════════════════════════════
   렌더
════════════════════════════════════════════ */
function renderCards() {
    const sorted = [...DIARY].sort((a, b) => b.entryDate.localeCompare(a.entryDate));
    const grid = document.getElementById('diaryGrid');

    if (sorted.length === 0) {
        grid.innerHTML = `<p style="color:#64748b;text-align:center;padding:3rem;grid-column:1/-1;">아직 등록된 일기가 없습니다.<br>우측 하단 📔 버튼으로 첫 일기를 작성해보세요!</p>`;
        return;
    }

    grid.innerHTML = sorted.map(d => {
        const dt = new Date(d.entryDate + 'T00:00:00');
        const day = dt.getDate();
        const monthYear = `${dt.getMonth()+1}월 ${dt.getFullYear()}`;
        const weekday = WEEKDAYS[dt.getDay()] + '요일';
        const moodEmoji = MOOD_EMOJI[d.mood] || '';
        return `
        <div class="diary-card">
            <div class="diary-date-badge">
                <span class="diary-day">${day}</span>
                <span class="diary-month-year">${monthYear}</span>
                <span class="diary-weekday">${weekday}</span>
            </div>
            <div class="diary-body" onclick="showDetail('${d.id}')" style="cursor:pointer;">
                <span class="mood-badge mood-${d.mood}">${moodEmoji} ${d.mood ? d.mood.charAt(0).toUpperCase()+d.mood.slice(1) : ''}</span>
                <div class="diary-title">${d.title}</div>
                <div class="diary-excerpt">${d.excerpt}</div>
            </div>
            <div class="card-footer-bar">
                <span class="view-hint" onclick="showDetail('${d.id}')">Read →</span>
                <div class="card-actions">
                    <button class="edit-btn" onclick="editDiary('${d.id}'); event.stopPropagation();">Edit</button>
                    <button class="delete-btn" onclick="deleteDiary('${d.id}'); event.stopPropagation();">Delete</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function showDetail(id) {
    const d = DIARY.find(x => x.id === id);
    if (!d) return;
    const dt = new Date(d.entryDate + 'T00:00:00');
    const label = `${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일 (${WEEKDAYS[dt.getDay()]}) — ${MOOD_EMOJI[d.mood] || ''} ${d.mood || ''}`;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    document.getElementById('detailContent').innerHTML = `
        <div class="detail-meta">${label}</div>
        <h1>${d.title}</h1>
        ${d.body}`;
}
function backToList() {
    document.getElementById('listView').style.display = 'block';
    document.getElementById('detailView').style.display = 'none';
}

/* ════════════════════════════════════════════
   글쓰기/수정
════════════════════════════════════════════ */
function todayStr() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}
function openWrite() {
    if (!getToken()) { showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true); setTimeout(openTokenModal, 1000); return; }
    editingId = null;
    document.getElementById('writeModalTitle').textContent = '📔 새 일기 작성';
    document.getElementById('publishBtn').textContent = '📤 GitHub에 등록';
    document.getElementById('dDate').value = todayStr();
    document.getElementById('dTitle').value = '';
    document.getElementById('dMood').value = 'good';
    document.getElementById('dExcerpt').value = '';
    initQuillEditor(); quillEditor.setContents([]);
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function editDiary(id) {
    if (!getToken()) { showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true); setTimeout(openTokenModal, 1000); return; }
    const d = DIARY.find(x => x.id === id);
    if (!d) return;
    editingId = id;
    document.getElementById('writeModalTitle').textContent = '✏️ 일기 수정';
    document.getElementById('publishBtn').textContent = '💾 GitHub에 저장';
    document.getElementById('dDate').value = d.entryDate;
    document.getElementById('dTitle').value = d.title;
    document.getElementById('dMood').value = d.mood || 'good';
    document.getElementById('dExcerpt').value = d.excerpt;
    initQuillEditor(); quillEditor.root.innerHTML = d.body;
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeWrite() {
    document.getElementById('writeOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

async function publishDiary() {
    const entryDate = document.getElementById('dDate').value;
    const title     = document.getElementById('dTitle').value.trim();
    const mood      = document.getElementById('dMood').value;
    const excerpt   = document.getElementById('dExcerpt').value.trim();
    const body      = quillEditor.root.innerHTML;

    if (!entryDate || !title || !excerpt || !body.replace(/<[^>]*>/g, '').trim()) {
        showToast('날짜, 제목, 요약, 본문을 모두 입력해주세요.', true); return;
    }
    const token = getToken();
    if (!token) { showToast('GitHub 토큰을 설정해주세요.', true); openTokenModal(); return; }

    try {
        const btn = document.getElementById('publishBtn');
        btn.disabled = true; btn.textContent = '⏳ GitHub에 업로드 중...';
        showToast('⏳ 처리 중...');
        const data = await ghGet(token);
        const fileText = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));

        if (editingId) {
            const idx = DIARY.findIndex(d => d.id === editingId);
            if (idx !== -1) DIARY[idx] = { ...DIARY[idx], entryDate, title, mood, excerpt, body };
        } else {
            DIARY.unshift({ id: 'd' + Date.now(), entryDate, title, mood, excerpt, body });
        }

        const newContent = injectJSON(fileText, JSON.stringify(DIARY));
        const msg = editingId ? `✏️ Edit diary: ${title}` : `✍️ Add diary: ${title}`;
        await ghPut(token, data.sha, newContent, msg);
        closeWrite();
        showToast('✅ GitHub에 등록되었습니다! 잠시 후 사이트가 업데이트됩니다.');
        setTimeout(() => location.reload(), 2000);
    } catch (err) {
        showToast(`❌ 오류: ${err.message}`, true);
        const btn = document.getElementById('publishBtn');
        btn.disabled = false;
        btn.textContent = editingId ? '💾 GitHub에 저장' : '📤 GitHub에 등록';
    }
}

function deleteDiary(id) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    const token = getToken();
    if (!token) { showToast('GitHub Token이 없습니다.', true); return; }
    showToast('⏳ 삭제 중...');
    const idx = DIARY.findIndex(d => d.id === id);
    if (idx === -1) return;
    const removed = DIARY[idx];
    ghGet(token).then(data => {
        const fileText = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        DIARY.splice(idx, 1);
        const newContent = injectJSON(fileText, JSON.stringify(DIARY));
        return ghPut(token, data.sha, newContent, `🗑 Delete diary: ${removed.title}`);
    }).then(() => {
        renderCards();
        showToast('🗑 삭제됐습니다!');
        setTimeout(() => location.reload(), 3000);
    }).catch(err => showToast('❌ ' + err.message, true));
}

/* ════════════════════════════════════════════
   토스트
════════════════════════════════════════════ */
function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.toggle('error', isError);
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

/* ════════════════════════════════════════════
   초기화
════════════════════════════════════════════ */
loadDiary();
renderCards();
updateTokenIndicator();
</script>
