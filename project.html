<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project | HoJin Choi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-hero">
    <h1>Project</h1>
    <p>항공우주 데이터 분석 및 AI 알고리즘 개발 프로젝트 모음입니다.</p>
</div>

<div style="display:flex; justify-content:center; padding:0.75rem 1rem 0;">
    <a href="index.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">← Back to Home</a>
</div>

<div class="filters">
    <button class="filter-btn active" onclick="filterProjects('all',this)">All</button>
    <button class="filter-btn" onclick="filterProjects('aviation',this)">Aviation</button>
    <button class="filter-btn" onclick="filterProjects('ai',this)">AI / ML</button>
    <button class="filter-btn" onclick="filterProjects('data',this)">Data Analysis</button>
</div>

<div class="projects-grid" id="projectsGrid"></div>

<!-- 디테일 모달 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <button class="modal-close-btn" onclick="closeModal()">&#10005;</button>
        <div id="modalContent"></div>
    </div>
</div>

<!-- 글쓰기/수정 모달 -->
<div class="write-overlay" id="writeOverlay">
    <div class="write-modal">
        <div class="write-modal-header">
            <h2 id="writeModalTitle">✍️ 새 프로젝트 작성</h2>
            <button class="write-modal-close" onclick="closeWrite()">&#10005;</button>
        </div>

        <label class="wm-label">프로젝트 제목 *</label>
        <input id="pTitle" type="text" class="wm-input" placeholder="e.g. Flight Delay Prediction System">

        <div class="wm-row">
            <div>
                <label class="wm-label">카테고리</label>
                <select id="pType" class="wm-select">
                    <option value="aviation">Aviation</option>
                    <option value="ai">AI / ML</option>
                    <option value="data">Data Analysis</option>
                </select>
            </div>
            <div>
                <label class="wm-label">아이콘 (이모지)</label>
                <input id="pIcon" type="text" class="wm-input" placeholder="✈️" maxlength="4">
            </div>
        </div>

        <label class="wm-label">설명 * <span style="font-weight:400; color:#475569; text-transform:none; letter-spacing:0;">(카드에 표시)</span></label>
        <textarea id="pDesc" class="wm-textarea" rows="3" placeholder="프로젝트를 간략히 소개해주세요..."></textarea>

        <div class="wm-row">
            <div>
                <label class="wm-label">Problem</label>
                <textarea id="pProblem" class="wm-textarea" rows="3" placeholder="어떤 문제를 해결했나요?"></textarea>
            </div>
            <div>
                <label class="wm-label">Solution</label>
                <textarea id="pSolution" class="wm-textarea" rows="3" placeholder="어떻게 해결했나요?"></textarea>
            </div>
        </div>

        <label class="wm-label">Results</label>
        <textarea id="pResult" class="wm-textarea" rows="2" placeholder="어떤 성과를 달성했나요?"></textarea>

        <label class="wm-label">기술 스택</label>
        <div class="wm-tech-row">
            <input id="techInput" type="text" class="wm-input" placeholder="e.g. Python"
                   onkeydown="if(event.key==='Enter'){addTech();event.preventDefault();}">
            <button type="button" class="wm-add-btn" onclick="addTech()">+ 추가</button>
        </div>
        <div class="tech-pills" id="techPills"></div>
        <p class="wm-hint">Enter 또는 + 추가 버튼으로 입력</p>

        <!-- 프로젝트 상세 설명 (Quill 에디터) -->
        <label class="wm-label">프로젝트 상세 설명 (선택) <span style="font-weight:400; color:#475569; text-transform:none; letter-spacing:0;">(시각적 편집)</span></label>
        <div class="editor-container">
            <div id="pDetailsEditor" style="background:#1e293b; border-radius:8px;"></div>
        </div>

        <button class="wm-submit" id="publishBtn" onclick="publishProject()">🚀 GitHub에 등록</button>
    </div>
</div>

<!-- 토큰 설정 모달 -->
<div class="write-overlay" id="tokenOverlay">
    <div class="write-modal" style="max-width:480px;">
        <div class="write-modal-header">
            <h2>🔑 GitHub Token 설정</h2>
            <button class="write-modal-close" onclick="closeTokenModal()">&#10005;</button>
        </div>
        <p style="font-size:0.9rem; color:#94a3b8; margin-bottom:1.5rem; line-height:1.6;">
            GitHub에 글을 발행하려면 Personal Access Token이 필요합니다.<br>
            토큰은 이 브라우저에만 저장되며 외부로 전송되지 않습니다.
        </p>
        <label class="wm-label">Personal Access Token
            <a href="https://github.com/settings/tokens/new?scopes=repo&description=portfolio-write"
               target="_blank"
               style="font-weight:400; color:#60a5fa; text-transform:none; letter-spacing:0; margin-left:0.5rem;">
               발급하러 가기 →
            </a>
        </label>
        <input id="tokenInput" type="password" class="wm-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        <p class="wm-hint">repo 권한 체크 후 발급 · 페이지를 닫아도 유지됩니다</p>
        <button class="wm-submit" onclick="saveToken()">💾 저장</button>
        <button type="button" onclick="clearToken()" style="width:100%; margin-top:0.6rem; padding:0.6rem; background:transparent; border:1px solid #334155; border-radius:8px; color:#64748b; font-family:inherit; font-size:0.85rem; cursor:pointer;">
            저장된 토큰 삭제
        </button>
    </div>
</div>

<!-- FAB 그룹 -->
<div class="fab-group">
    <button class="fab fab-token" onclick="openTokenModal()" title="GitHub Token 설정">🔑</button>
    <button class="fab fab-write" onclick="openWrite()" title="새 프로젝트 작성">✍️</button>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<!-- 데이터 저장 영역 (HTML 주석 내 JSON) -->
<!--__PROJECTS_DATA_START__
[{"id":"c1","title":"비행 데이터 이상 탐지 시스템","desc":"항공기 운항 중 수집된 비행 데이터(QAR)를 분석하여 정상 범위를 벗어난 파라미터를 실시간으로 탐지하는 머신러닝 기반 이상 탐지 시스템입니다. (수정)","date":"2026. 3. 3.","time":"오전 03:16","type":"aviation","icon":"✈️","tech":["Python","Scikit-learn","Pandas","Isolation Forest","Matplotlib"],"problem":"비행 중 발생하는 미세한 이상 징후는 육안 검토만으로는 놓치기 쉬우며, 사후 분석에 많은 시간이 소요됩니다. (수정)","solution":"QAR 데이터에서 주요 파라미터를 추출하고 Isolation Forest 알고리즘을 적용해 이상 구간을 자동 탐지하는 파이프라인을 구축했습니다. (수정)","result":"기존 수동 검토 대비 탐지 소요 시간 70% 단축, 이상 탐지 정확도 88% 달성. (수정)","detail":"<p>프로젝트 예시입니다.(수정)</p>"}]
__PROJECTS_DATA_END__-->

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
/* ── GitHub 설정 ── */
const GH_OWNER  = 'Gansaw';
const GH_REPO   = 'website';
const GH_FILE   = 'project.html';
const GH_BRANCH = 'main';
const TOKEN_KEY = 'gh_token_project';

/* ── 데이터 마커 ── */
const DATA_START_MARKER = '<!--__PROJECTS_DATA_START__';
const DATA_END_MARKER   = '__PROJECTS_DATA_END__-->';

let PROJECTS = [];
const TYPE_LABEL = { aviation:'Aviation', ai:'AI / ML', data:'Data Analysis' };
let currentFilter = 'all';
let techList = [];
let editingId = null;
let quillEditor = null;

/* ════════════════════════════════════════════
   데이터 로드
════════════════════════════════════════════ */
function loadProjects() {
    try {
        const html = document.documentElement.outerHTML;
        const startIdx = html.indexOf(DATA_START_MARKER);
        const endIdx = html.indexOf(DATA_END_MARKER);
        
        if (startIdx !== -1 && endIdx !== -1) {
            const jsonStr = html.substring(startIdx + DATA_START_MARKER.length, endIdx).trim();
            PROJECTS = JSON.parse(jsonStr);
        }
    } catch (e) {
        console.error('데이터 로드 오류:', e);
        PROJECTS = [];
    }
}

/* ════════════════════════════════════════════
   Quill 에디터 초기화
════════════════════════════════════════════ */
function initQuillEditor() {
    if (!quillEditor) {
        quillEditor = new Quill('#pDetailsEditor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline', 'strike'],
                    ['blockquote', 'code-block'],
                    [{ 'header': 1 }, { 'header': 2 }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'script': 'sub'}, { 'script': 'super' }],
                    [{ 'indent': '-1'}, { 'indent': '+1' }],
                    [{ 'size': ['small', false, 'large', 'huge'] }],
                    [{ 'font': [] }],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'align': [] }],
                    ['link'],
                    ['clean']
                ]
            },
            placeholder: '프로젝트 상세 설명을 입력하세요...'
        });
    }
}

/* ════════════════════════════════════════════
   토큰 관리
════════════════════════════════════════════ */
function getToken()  { return localStorage.getItem(TOKEN_KEY) || ''; }
function saveToken() {
    const t = document.getElementById('tokenInput').value.trim();
    if (!t) { showToast('토큰을 입력해주세요.', true); return; }
    localStorage.setItem(TOKEN_KEY, t);
    closeTokenModal();
    updateTokenIndicator();
    showToast('✅ 토큰이 저장됐습니다.');
}
function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById('tokenInput').value = '';
    updateTokenIndicator();
    showToast('🗑 토큰이 삭제됐습니다.');
}
function updateTokenIndicator() {
    document.querySelector('.fab-token').style.borderColor = getToken() ? '#10b981' : '#1e3a5f';
}
function openTokenModal() {
    document.getElementById('tokenInput').value = getToken();
    document.getElementById('tokenOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeTokenModal() {
    document.getElementById('tokenOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

/* ════════════════════════════════════════════
   GitHub API 헬퍼
════════════════════════════════════════════ */
async function ghGet(token) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`,
        { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
    );
    if (!res.ok) throw new Error(`GitHub API 오류: ${res.status} — 토큰을 확인해주세요.`);
    return res.json();
}
async function ghPut(token, sha, newContent, message) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`,
        {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(newContent))), sha, branch: GH_BRANCH })
        }
    );
    if (!res.ok) { const err = await res.json(); throw new Error(err.message || `GitHub 커밋 실패: ${res.status}`); }
    return res.json();
}

function injectJSON(fileText, newJSON) {
    const startIdx = fileText.indexOf(DATA_START_MARKER);
    const endIdx = fileText.indexOf(DATA_END_MARKER);
    if (startIdx === -1 || endIdx === -1) throw new Error('데이터 마커를 찾을 수 없습니다.');
    return fileText.slice(0, startIdx + DATA_START_MARKER.length) + '\n' + newJSON + '\n' + fileText.slice(endIdx);
}

/* ════════════════════════════════════════════
   시간 포맷팅
════════════════════════════════════════════ */
function getCurrentDateTime() {
    const now = new Date();
    const date = now.toLocaleDateString('ko-KR');
    const time = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    return { date, time };
}

/* ════════════════════════════════════════════
   렌더
════════════════════════════════════════════ */
function renderProjects(filter) {
    currentFilter = filter;
    const list = filter === 'all' ? PROJECTS : PROJECTS.filter(p => p.type === filter);
    document.getElementById('projectsGrid').innerHTML = list.length === 0
        ? `<p style="color:#64748b;text-align:center;padding:3rem;grid-column:1/-1;">아직 등록된 프로젝트가 없습니다.</p>`
        : list.map(p => `
        <div class="project-card" onclick="openModal('${p.id}')">
            <div class="project-image">${p.icon || '📁'}</div>
            <div class="project-content">
                <div class="card-meta">
                    <span class="project-type type-${p.type}">${TYPE_LABEL[p.type]}</span>
                    <span class="card-date">${p.date} ${p.time}</span>
                </div>
                <h3 class="project-title">${p.title}</h3>
                <p class="project-description">${p.desc}</p>
                <div class="project-tech">${(p.tech||[]).map(t=>`<span class="tech-tag">${t}</span>`).join('')}</div>
            </div>
            <div class="card-footer-bar">
                <span class="view-hint">View Details →</span>
                <div class="card-actions">
                    <button class="edit-btn" onclick="openEdit('${p.id}',event)">Edit</button>
                    <button class="delete-btn" onclick="deleteProject('${p.id}',event)">Delete</button>
                </div>
            </div>
        </div>`).join('');
}
function filterProjects(filter, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProjects(filter);
}

/* ════════════════════════════════════════════
   디테일 모달
════════════════════════════════════════════ */
function openModal(id) {
    const p = PROJECTS.find(x => String(x.id) === String(id));
    if (!p) return;
    document.getElementById('modalContent').innerHTML = `
        <span class="project-type type-${p.type}">${TYPE_LABEL[p.type]}</span>
        <h2 class="modal-title">${p.title}</h2>
        <div class="modal-section"><h3>Overview</h3><p>${p.desc}</p></div>
        <div class="modal-section"><h3>Problem</h3><p>${p.problem||'—'}</p></div>
        <div class="modal-section"><h3>Solution</h3><p>${p.solution||'—'}</p></div>
        <div class="modal-section"><h3>Results</h3><p>${p.result||'—'}</p></div>
        ${p.detail ? `<div class="modal-section"><h3>상세 설명</h3><div class="modal-detail-content">${p.detail}</div></div>` : ''}
        <div class="modal-section"><h3>Technologies</h3>
            <div class="project-tech">${(p.tech||[]).map(t=>`<span class="tech-tag">${t}</span>`).join('')}</div>
        </div>`;

    document.getElementById('modalOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

/* ════════════════════════════════════════════
   글쓰기 / 수정 모달
════════════════════════════════════════════ */
function openWrite() {
    if (!getToken()) {
        showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true);
        setTimeout(openTokenModal, 1000);
        return;
    }
    editingId = null;
    document.getElementById('writeModalTitle').textContent = '✍️ 새 프로젝트 작성';
    document.getElementById('publishBtn').textContent = '🚀 GitHub에 등록';
    ['pTitle','pDesc','pProblem','pSolution','pResult','pIcon'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('pType').value = 'aviation';
    techList = []; 
    renderPills();
    initQuillEditor();
    quillEditor.setContents([]);
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function openEdit(id, e) {
    if (e) e.stopPropagation();
    if (!getToken()) {
        showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true);
        setTimeout(openTokenModal, 1000);
        return;
    }
    const p = PROJECTS.find(x => String(x.id) === String(id));
    if (!p) return;

    editingId = p.id;
    document.getElementById('writeModalTitle').textContent = '✏️ 프로젝트 수정';
    document.getElementById('publishBtn').textContent = '💾 GitHub에 저장';
    document.getElementById('pTitle').value   = p.title;
    document.getElementById('pDesc').value    = p.desc;
    document.getElementById('pType').value    = p.type;
    document.getElementById('pIcon').value    = p.icon || '';
    document.getElementById('pProblem').value = p.problem !== '—' ? p.problem : '';
    document.getElementById('pSolution').value= p.solution !== '—' ? p.solution : '';
    document.getElementById('pResult').value  = p.result !== '—' ? p.result : '';
    techList = [...(p.tech || [])]; 
    renderPills();
    initQuillEditor();
    if (p.detail) {
        quillEditor.root.innerHTML = p.detail;
    } else {
        quillEditor.setContents([]);
    }

    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeWrite() {
    document.getElementById('writeOverlay').classList.remove('active');
    document.body.style.overflow = '';
    editingId = null;
}

function addTech() {
    const val = document.getElementById('techInput').value.trim();
    if (!val || techList.includes(val)) return;
    techList.push(val);
    document.getElementById('techInput').value = '';
    renderPills();
}
function removeTech(t) { techList = techList.filter(x => x !== t); renderPills(); }
function renderPills() {
    document.getElementById('techPills').innerHTML = techList.map(t =>
        `<span class="tech-pill">${t}<button type="button" onclick="removeTech('${t}')">×</button></span>`
    ).join('');
}

/* ── 등록 / 저장 ── */
async function publishProject() {
    const title = document.getElementById('pTitle').value.trim();
    const desc  = document.getElementById('pDesc').value.trim();
    if (!title || !desc) { showToast('제목과 설명을 입력해주세요.', true); return; }

    const token = getToken();
    if (!token) { showToast('GitHub Token이 없습니다. 🔑 버튼으로 설정해주세요.', true); return; }

    const btn = document.getElementById('publishBtn');
    btn.disabled = true;
    btn.textContent = '⏳ GitHub에 업로드 중...';

    try {
        const { date, time } = getCurrentDateTime();
        const detail = quillEditor.root.innerHTML;
        const item = {
            id:       editingId || ('c' + Date.now()),
            title, desc, date, time,
            type:     document.getElementById('pType').value,
            icon:     document.getElementById('pIcon').value.trim() || '📁',
            tech:     [...techList],
            problem:  document.getElementById('pProblem').value.trim() || '—',
            solution: document.getElementById('pSolution').value.trim() || '—',
            result:   document.getElementById('pResult').value.trim() || '—',
            detail:   detail || ''
        };

        const { content: b64, sha } = await ghGet(token);
        const fileText = decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));

        let newProjects;
        let commitMsg;
        if (editingId) {
            newProjects = PROJECTS.map(p => String(p.id) === String(editingId) ? item : p);
            commitMsg = `✏️ Edit project: ${title}`;
        } else {
            newProjects = [item, ...PROJECTS];
            commitMsg = `✍️ Add project: ${title}`;
        }

        const newJSON = JSON.stringify(newProjects);
        const newFile = injectJSON(fileText, newJSON);
        await ghPut(token, sha, newFile, commitMsg);

        showToast(editingId ? '✅ 수정됐습니다! 잠시 후 사이트가 업데이트됩니다.' : '✅ GitHub에 등록됐습니다! 잠시 후 사이트가 업데이트됩니다.');
        closeWrite();
        setTimeout(() => location.reload(), 3000);

    } catch (err) {
        showToast('❌ ' + err.message, true);
    } finally {
        btn.disabled = false;
        btn.textContent = editingId ? '💾 GitHub에 저장' : '🚀 GitHub에 등록';
    }
}

/* ── 삭제 ── */
async function deleteProject(id, e) {
    if (e) e.stopPropagation();
    if (!confirm('이 프로젝트를 삭제할까요?')) return;
    const token = getToken();
    if (!token) { showToast('GitHub Token이 없습니다. 🔑 버튼으로 설정해주세요.', true); return; }
    showToast('⏳ 삭제 중...');
    try {
        const { content: b64, sha } = await ghGet(token);
        const fileText   = decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
        const newProjects = PROJECTS.filter(p => String(p.id) !== String(id));
        const newJSON    = JSON.stringify(newProjects);
        const newFile    = injectJSON(fileText, newJSON);
        const deleted    = PROJECTS.find(p => String(p.id) === String(id));
        await ghPut(token, sha, newFile, `🗑 Delete project: ${deleted?.title || id}`);
        showToast('🗑 삭제됐습니다! 잠시 후 사이트가 업데이트됩니다.');
        setTimeout(() => location.reload(), 3000);
    } catch (err) {
        showToast('❌ ' + err.message, true);
    }
}

/* ════════════════════════════════════════════
   이벤트 & 토스트
════════════════════════════════════════════ */
['modalOverlay','writeOverlay','tokenOverlay'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
        if (e.target === document.getElementById(id)) {
            if (id === 'modalOverlay') closeModal();
            else if (id === 'writeOverlay') closeWrite();
            else closeTokenModal();
        }
    });
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeWrite(); closeTokenModal(); }
});
function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), isError ? 4000 : 2800);
}

/* 초기화 */
loadProjects();
updateTokenIndicator();
renderProjects('all');
</script>
