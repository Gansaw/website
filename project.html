<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project | HoJin Choi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── 페이지 히어로 ── -->
<div class="page-hero">
    <h1>Project</h1>
    <p>항공우주 데이터 분석 및 AI 알고리즘 개발 프로젝트 모음입니다.</p>
</div>

<div style="display:flex; justify-content:center; padding:0.75rem 1rem 0;">
    <a href="index.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">← Back to Home</a>
</div>

<!-- ── 필터 ── -->
<div class="filters">
    <button class="filter-btn active" onclick="filterProjects('all',this)">All</button>
    <button class="filter-btn" onclick="filterProjects('aviation',this)">Aviation</button>
    <button class="filter-btn" onclick="filterProjects('ai',this)">AI / ML</button>
    <button class="filter-btn" onclick="filterProjects('data',this)">Data Analysis</button>
</div>

<!-- ── 카드 그리드 ── -->
<div class="projects-grid" id="projectsGrid"></div>

<!-- ── 디테일 뷰 모달 ── -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <button class="modal-close-btn" onclick="closeModal()">&#10005;</button>
        <div id="modalContent"></div>
    </div>
</div>

<!-- ── 글쓰기 모달 ── -->
<div class="write-overlay" id="writeOverlay">
    <div class="write-modal">
        <div class="write-modal-header">
            <h2>✍️ 새 프로젝트 작성</h2>
            <button class="write-modal-close" onclick="closeWrite()">&#10005;</button>
        </div>

        <label class="wm-label">프로젝트 제목 *</label>
        <input id="pTitle" type="text" class="wm-input" placeholder="e.g. Flight Delay Prediction System">

        <div class="wm-row">
            <div>
                <label class="wm-label">카테고리</label>
                <select id="pType" class="wm-select">
                    <option value="aviation">Aviation</option>
                    <option value="ai">AI / ML</option>
                    <option value="data">Data Analysis</option>
                </select>
            </div>
            <div>
                <label class="wm-label">아이콘 (이모지)</label>
                <input id="pIcon" type="text" class="wm-input" placeholder="✈️" maxlength="4">
            </div>
        </div>

        <label class="wm-label">설명 *</label>
        <textarea id="pDesc" class="wm-textarea" rows="3" placeholder="프로젝트를 간략히 소개해주세요..."></textarea>

        <div class="wm-row">
            <div>
                <label class="wm-label">Problem</label>
                <textarea id="pProblem" class="wm-textarea" rows="3" placeholder="어떤 문제를 해결했나요?"></textarea>
            </div>
            <div>
                <label class="wm-label">Solution</label>
                <textarea id="pSolution" class="wm-textarea" rows="3" placeholder="어떻게 해결했나요?"></textarea>
            </div>
        </div>

        <label class="wm-label">Results</label>
        <textarea id="pResult" class="wm-textarea" rows="2" placeholder="어떤 성과를 달성했나요?"></textarea>

        <label class="wm-label">기술 스택</label>
        <div class="wm-tech-row">
            <input id="techInput" type="text" class="wm-input" placeholder="e.g. Python"
                   onkeydown="if(event.key==='Enter'){addTech();event.preventDefault();}">
            <button class="wm-add-btn" onclick="addTech()">+ 추가</button>
        </div>
        <div class="tech-pills" id="techPills"></div>
        <p class="wm-hint">Enter 또는 + 추가 버튼으로 입력</p>

        <button class="wm-submit" onclick="publishProject()">🚀 프로젝트 등록</button>
    </div>
</div>

<!-- ── FAB ── -->
<button class="fab" onclick="openWrite()" title="새 프로젝트 작성">✍️</button>

<!-- ── 토스트 ── -->
<div class="toast" id="toast"></div>

<script>
/* ────────────────────────────────────────────
   데이터
──────────────────────────────────────────── */
const PROJECTS = [
    { id:'c1', title:'비행 데이터 이상 탐지 시스템',
      desc:'항공기 운항 중 수집된 비행 데이터(QAR)를 분석하여 정상 범위를 벗어난 파라미터를 실시간으로 탐지하는 머신러닝 기반 이상 탐지 시스템입니다.',
      type:'aviation', icon:'✈️',
      tech:['Python','Scikit-learn','Pandas','Isolation Forest','Matplotlib'],
      problem:'비행 중 발생하는 미세한 이상 징후는 육안 검토만으로는 놓치기 쉬우며, 사후 분석에 많은 시간이 소요됩니다.',
      solution:'QAR 데이터에서 주요 파라미터를 추출하고 Isolation Forest 알고리즘을 적용해 이상 구간을 자동 탐지하는 파이프라인을 구축했습니다.',
      result:'기존 수동 검토 대비 탐지 소요 시간 70% 단축, 이상 탐지 정확도 88% 달성.' }
];

const TYPE_LABEL = { aviation:'Aviation', ai:'AI / ML', data:'Data Analysis' };
let currentFilter = 'all';
let techList = [];

/* ────────────────────────────────────────────
   스토리지 헬퍼
──────────────────────────────────────────── */
function loadCustom()   { try { return JSON.parse(localStorage.getItem('customProjects') || '[]'); } catch { return []; } }
function saveCustom(d)  { localStorage.setItem('customProjects', JSON.stringify(d)); }
function allProjects()  { return [...loadCustom(), ...PROJECTS]; }

/* ────────────────────────────────────────────
   렌더
──────────────────────────────────────────── */
function renderProjects(filter) {
    currentFilter = filter;
    const list = filter === 'all' ? allProjects() : allProjects().filter(p => p.type === filter);
    document.getElementById('projectsGrid').innerHTML = list.map(p => {
        const custom = String(p.id).startsWith('c');
        return `
        <div class="project-card" onclick="openModal('${p.id}')">
            <div class="project-image">${p.icon || '📁'}</div>
            <div class="project-content">
                <span class="project-type type-${p.type}">${TYPE_LABEL[p.type]}</span>
                <h3 class="project-title">${p.title}</h3>
                <p class="project-description">${p.desc}</p>
                <div class="project-tech">${(p.tech||[]).map(t=>`<span class="tech-tag">${t}</span>`).join('')}</div>
            </div>
            <div class="card-footer-bar">
                <span class="view-hint">View Details →</span>
                ${custom ? `<button class="delete-btn" onclick="deleteProject('${p.id}',event)">🗑 삭제</button>` : ''}
            </div>
        </div>`;
    }).join('');
}

function filterProjects(filter, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProjects(filter);
}

/* ────────────────────────────────────────────
   디테일 모달
──────────────────────────────────────────── */
function openModal(id) {
    const p = allProjects().find(x => String(x.id) === String(id));
    if (!p) return;
    document.getElementById('modalContent').innerHTML = `
        <span class="project-type type-${p.type}">${TYPE_LABEL[p.type]}</span>
        <h2 class="modal-title">${p.title}</h2>
        <div class="modal-section"><h3>Overview</h3><p>${p.desc}</p></div>
        <div class="modal-section"><h3>Problem</h3><p>${p.problem || '—'}</p></div>
        <div class="modal-section"><h3>Solution</h3><p>${p.solution || '—'}</p></div>
        <div class="modal-section"><h3>Results</h3><p>${p.result || '—'}</p></div>
        <div class="modal-section"><h3>Technologies</h3>
            <div class="project-tech">${(p.tech||[]).map(t=>`<span class="tech-tag">${t}</span>`).join('')}</div>
        </div>`;
    document.getElementById('modalOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

/* ────────────────────────────────────────────
   글쓰기 모달
──────────────────────────────────────────── */
function openWrite() {
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeWrite() {
    document.getElementById('writeOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

/* 기술 태그 */
function addTech() {
    const val = document.getElementById('techInput').value.trim();
    if (!val || techList.includes(val)) return;
    techList.push(val);
    document.getElementById('techInput').value = '';
    renderPills();
}
function removeTech(t) { techList = techList.filter(x => x !== t); renderPills(); }
function renderPills() {
    document.getElementById('techPills').innerHTML = techList.map(t =>
        `<span class="tech-pill">${t}<button onclick="removeTech('${t}')">×</button></span>`
    ).join('');
}

/* 등록 */
function publishProject() {
    const title = document.getElementById('pTitle').value.trim();
    const desc  = document.getElementById('pDesc').value.trim();
    if (!title || !desc) { showToast('제목과 설명을 입력해주세요.', true); return; }

    const list = loadCustom();
    list.unshift({
        id:       'c' + Date.now(),
        title, desc,
        type:     document.getElementById('pType').value,
        icon:     document.getElementById('pIcon').value.trim() || '📁',
        tech:     [...techList],
        problem:  document.getElementById('pProblem').value.trim() || '—',
        solution: document.getElementById('pSolution').value.trim() || '—',
        result:   document.getElementById('pResult').value.trim() || '—',
        createdAt: new Date().toLocaleDateString('ko-KR')
    });
    saveCustom(list);

    ['pTitle','pDesc','pProblem','pSolution','pResult','pIcon'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('pType').value = 'aviation';
    techList = []; renderPills();
    closeWrite();
    renderProjects(currentFilter);
    showToast('✅ 프로젝트가 등록되었습니다!');
}

/* 삭제 */
function deleteProject(id, e) {
    e.stopPropagation();
    if (!confirm('이 프로젝트를 삭제할까요?')) return;
    saveCustom(loadCustom().filter(p => p.id !== id));
    renderProjects(currentFilter);
    showToast('🗑 삭제되었습니다.');
}

/* ────────────────────────────────────────────
   이벤트 & 토스트
──────────────────────────────────────────── */
document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.getElementById('writeOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('writeOverlay')) closeWrite();
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeWrite(); }
});

function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
}

/* ── 초기화 ── */
renderProjects('all');
</script>
</body>
</html>
