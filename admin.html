<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | HoJin Choi</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080e1a;
            --surface: #0f1b2d;
            --surface2: #162033;
            --border: #1e3a5f;
            --blue: #3b82f6;
            --blue-dim: rgba(59,130,246,0.12);
            --cyan: #22d3ee;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --text: #e2e8f0;
            --muted: #64748b;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Sora', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; }

        /* ── LOGIN ── */
        #loginScreen {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at 50% 0%, rgba(59,130,246,0.08) 0%, transparent 70%), var(--bg);
        }
        .login-box {
            width: 100%; max-width: 380px; padding: 2.5rem;
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
            box-shadow: 0 0 60px rgba(59,130,246,0.06);
        }
        .login-logo { text-align: center; margin-bottom: 2rem; }
        .login-logo .icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .login-logo h1 { font-size: 1.3rem; font-weight: 700; color: var(--text); }
        .login-logo p { font-size: 0.8rem; color: var(--muted); font-family: var(--mono); }
        .login-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; display: block; }
        .login-input {
            width: 100%; padding: 0.75rem 1rem; background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-family: var(--mono); font-size: 0.95rem;
            outline: none; transition: border-color 0.2s;
        }
        .login-input:focus { border-color: var(--blue); }
        .login-btn {
            width: 100%; margin-top: 1.5rem; padding: 0.8rem;
            background: var(--blue); color: #fff; border: none; border-radius: 8px;
            font-family: var(--sans); font-size: 0.9rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .login-btn:hover { background: #2563eb; transform: translateY(-1px); }
        .login-error { margin-top: 0.75rem; color: var(--red); font-size: 0.8rem; text-align: center; display: none; }

        /* ── ADMIN SHELL ── */
        #adminShell { display: none; }

        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(8,14,26,0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.9rem 2rem;
        }
        .header-brand { display: flex; align-items: center; gap: 0.75rem; }
        .header-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
        .header-brand span { font-size: 0.95rem; font-weight: 700; }
        .header-brand small { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
        .header-actions { display: flex; gap: 0.75rem; align-items: center; }
        .btn-ghost { padding: 0.4rem 0.9rem; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 0.8rem; cursor: pointer; font-family: var(--sans); transition: all 0.2s; text-decoration: none; }
        .btn-ghost:hover { border-color: var(--blue); color: var(--text); }

        /* ── TABS ── */
        .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 2rem; background: var(--surface); }
        .tab { padding: 0.85rem 1.5rem; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; transition: all 0.2s; background: none; border-top: none; border-left: none; border-right: none; font-family: var(--sans); }
        .tab.active { color: var(--blue); border-bottom-color: var(--blue); }
        .tab:hover:not(.active) { color: var(--text); }

        /* ── LAYOUT ── */
        .admin-body { display: grid; grid-template-columns: 1fr 380px; gap: 0; min-height: calc(100vh - 105px); }
        .editor-panel { padding: 2rem; border-right: 1px solid var(--border); }
        .list-panel { padding: 1.5rem; background: var(--surface); overflow-y: auto; max-height: calc(100vh - 105px); }

        /* ── FORM ── */
        .form-section { margin-bottom: 1.5rem; }
        .form-label { display: block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 0.7rem 1rem; background: var(--surface);
            border: 1px solid var(--border); border-radius: 8px; color: var(--text);
            font-family: var(--sans); font-size: 0.9rem; outline: none; transition: border-color 0.2s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--blue); }
        .form-select { cursor: pointer; }
        .form-select option { background: var(--surface2); }
        .form-textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-hint { font-size: 0.72rem; color: var(--muted); margin-top: 0.35rem; font-family: var(--mono); }

        /* rich content textarea */
        #articleBody { min-height: 220px; font-family: var(--mono); font-size: 0.82rem; }

        .publish-btn {
            width: 100%; padding: 0.9rem; background: var(--blue); border: none; border-radius: 10px;
            color: #fff; font-family: var(--sans); font-size: 0.95rem; font-weight: 700; cursor: pointer;
            transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .publish-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59,130,246,0.3); }
        .publish-btn:active { transform: translateY(0); }

        .success-toast {
            position: fixed; bottom: 2rem; right: 2rem; z-index: 999;
            background: var(--green); color: #fff; padding: 0.75rem 1.5rem;
            border-radius: 10px; font-weight: 600; font-size: 0.85rem;
            transform: translateY(100px); opacity: 0; transition: all 0.3s;
        }
        .success-toast.show { transform: translateY(0); opacity: 1; }

        /* ── POST LIST ── */
        .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
        .list-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
        .list-count { font-family: var(--mono); font-size: 0.75rem; color: var(--blue); background: var(--blue-dim); padding: 0.2rem 0.5rem; border-radius: 4px; }

        .post-item {
            background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
            padding: 1rem; margin-bottom: 0.75rem; transition: all 0.2s;
        }
        .post-item:hover { border-color: var(--blue); }
        .post-item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
        .post-badge { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.15rem 0.5rem; border-radius: 4px; white-space: nowrap; }
        .badge-aviation { background: rgba(30,58,138,0.3); color: #93c5fd; }
        .badge-ai { background: rgba(109,40,217,0.25); color: #c4b5fd; }
        .badge-data { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .badge-insight { background: rgba(16,185,129,0.2); color: #6ee7b7; }
        .badge-review { background: rgba(59,130,246,0.2); color: #93c5fd; }
        .post-title { font-size: 0.85rem; font-weight: 600; color: var(--text); line-height: 1.4; margin: 0.4rem 0 0.3rem; }
        .post-meta { font-size: 0.72rem; color: var(--muted); font-family: var(--mono); }
        .delete-btn { background: transparent; border: 1px solid rgba(239,68,68,0.3); color: var(--red); padding: 0.25rem 0.6rem; border-radius: 5px; font-size: 0.7rem; cursor: pointer; font-family: var(--sans); transition: all 0.2s; white-space: nowrap; }
        .delete-btn:hover { background: rgba(239,68,68,0.15); border-color: var(--red); }
        .empty-state { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.85rem; }

        /* ── PROJECT EXTRAS ── */
        .tech-input-wrap { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
        .tech-input-wrap input { flex: 1; }
        .add-tech-btn { padding: 0.7rem 1rem; background: var(--blue-dim); border: 1px solid var(--border); border-radius: 8px; color: var(--blue); cursor: pointer; font-size: 0.8rem; font-family: var(--sans); white-space: nowrap; transition: all 0.2s; }
        .add-tech-btn:hover { background: rgba(59,130,246,0.2); }
        .tech-tags-preview { display: flex; flex-wrap: wrap; gap: 0.35rem; min-height: 24px; }
        .tech-tag-pill { font-size: 0.7rem; padding: 0.2rem 0.5rem; background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(59,130,246,0.25); border-radius: 6px; display: flex; align-items: center; gap: 0.3rem; }
        .tech-tag-pill button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; line-height: 1; padding: 0; }
        .tech-tag-pill button:hover { color: var(--red); }

        @media (max-width: 900px) {
            .admin-body { grid-template-columns: 1fr; }
            .list-panel { max-height: 400px; border-top: 1px solid var(--border); border-right: none; }
        }
    </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen">
    <div class="login-box">
        <div class="login-logo">
            <div class="icon">🛡️</div>
            <h1>Admin Panel</h1>
            <p>portfolio.hojinchoi</p>
        </div>
        <label class="login-label">Password</label>
        <input type="password" class="login-input" id="pwInput" placeholder="Enter password" onkeydown="if(event.key==='Enter') login()">
        <button class="login-btn" onclick="login()">Sign In →</button>
        <p class="login-error" id="loginError">Wrong password. Try again.</p>
    </div>
</div>

<!-- ── ADMIN SHELL ── -->
<div id="adminShell">
    <header>
        <div class="header-brand">
            <div class="dot"></div>
            <div>
                <span>Admin Panel</span><br>
                <small>HoJin Choi · Portfolio</small>
            </div>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn-ghost">← Home</a>
            <a href="project.html" class="btn-ghost">Project</a>
            <a href="article.html" class="btn-ghost">Article</a>
            <button class="btn-ghost" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('project', this)">✈ Project</button>
        <button class="tab" onclick="switchTab('article', this)">📝 Article</button>
    </div>

    <div class="admin-body">
        <!-- EDITOR -->
        <div class="editor-panel">

            <!-- PROJECT FORM -->
            <div id="projectForm">
                <div class="form-section">
                    <label class="form-label">Project Title</label>
                    <input type="text" class="form-input" id="pTitle" placeholder="e.g. Flight Delay Prediction System">
                </div>
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">Category</label>
                        <select class="form-select" id="pType">
                            <option value="aviation">Aviation</option>
                            <option value="ai">AI / ML</option>
                            <option value="data">Data Analysis</option>
                        </select>
                    </div>
                    <div class="form-section">
                        <label class="form-label">Icon (Emoji)</label>
                        <input type="text" class="form-input" id="pIcon" placeholder="✈️" maxlength="4">
                    </div>
                </div>
                <div class="form-section">
                    <label class="form-label">Description (Short)</label>
                    <textarea class="form-textarea" id="pDesc" rows="3" placeholder="Brief overview of the project..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">Problem</label>
                        <textarea class="form-textarea" id="pProblem" rows="3" placeholder="What problem does this solve?"></textarea>
                    </div>
                    <div class="form-section">
                        <label class="form-label">Solution</label>
                        <textarea class="form-textarea" id="pSolution" rows="3" placeholder="How did you solve it?"></textarea>
                    </div>
                </div>
                <div class="form-section">
                    <label class="form-label">Results</label>
                    <textarea class="form-textarea" id="pResult" rows="2" placeholder="What was the outcome?"></textarea>
                </div>
                <div class="form-section">
                    <label class="form-label">Technologies</label>
                    <div class="tech-input-wrap">
                        <input type="text" class="form-input" id="techInput" placeholder="e.g. Python" onkeydown="if(event.key==='Enter'){addTech();event.preventDefault();}">
                        <button class="add-tech-btn" onclick="addTech()">+ Add</button>
                    </div>
                    <div class="tech-tags-preview" id="techPreview"></div>
                    <p class="form-hint">Press Enter or click + Add</p>
                </div>
                <button class="publish-btn" onclick="publishProject()">
                    <span>🚀</span> Publish Project
                </button>
            </div>

            <!-- ARTICLE FORM -->
            <div id="articleForm" style="display:none;">
                <div class="form-section">
                    <label class="form-label">Article Title</label>
                    <input type="text" class="form-input" id="aTitle" placeholder="e.g. LLM이 바꾸는 세상">
                </div>
                <div class="form-row">
                    <div class="form-section">
                        <label class="form-label">Category</label>
                        <select class="form-select" id="aCategory">
                            <option value="insight">Insight</option>
                            <option value="review">Paper Review</option>
                        </select>
                    </div>
                    <div class="form-section">
                        <label class="form-label">Read Time</label>
                        <input type="text" class="form-input" id="aReadTime" placeholder="3분">
                    </div>
                </div>
                <div class="form-section">
                    <label class="form-label">Excerpt (Card Preview)</label>
                    <textarea class="form-textarea" id="aExcerpt" rows="3" placeholder="카드에 표시될 짧은 요약 (2~3줄)..."></textarea>
                </div>
                <div class="form-section">
                    <label class="form-label">Body (HTML 지원)</label>
                    <textarea class="form-textarea" id="articleBody" placeholder="&lt;p&gt;본문 내용을 입력하세요.&lt;/p&gt;&#10;&lt;h2&gt;소제목&lt;/h2&gt;&#10;&lt;ul&gt;&lt;li&gt;항목&lt;/li&gt;&lt;/ul&gt;"></textarea>
                    <p class="form-hint">HTML 태그 사용 가능: &lt;p&gt; &lt;h2&gt; &lt;ul&gt; &lt;li&gt; &lt;strong&gt; &lt;em&gt; &lt;blockquote&gt;</p>
                </div>
                <button class="publish-btn" onclick="publishArticle()">
                    <span>📤</span> Publish Article
                </button>
            </div>
        </div>

        <!-- POST LIST -->
        <div class="list-panel">
            <div class="list-header">
                <span class="list-title" id="listLabel">My Projects</span>
                <span class="list-count" id="listCount">0</span>
            </div>
            <div id="postList"></div>
        </div>
    </div>
</div>

<div class="success-toast" id="toast"></div>

<script>
// ── AUTH ──
const ADMIN_PW = 'hojin2024';

function login() {
    const pw = document.getElementById('pwInput').value;
    if (pw === ADMIN_PW) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminShell').style.display = 'block';
        renderList();
    } else {
        const err = document.getElementById('loginError');
        err.style.display = 'block';
        document.getElementById('pwInput').value = '';
        setTimeout(() => err.style.display = 'none', 3000);
    }
}
function logout() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminShell').style.display = 'none';
    document.getElementById('pwInput').value = '';
}

// ── TABS ──
let currentTab = 'project';
function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('projectForm').style.display = tab === 'project' ? 'block' : 'none';
    document.getElementById('articleForm').style.display = tab === 'article' ? 'block' : 'none';
    document.getElementById('listLabel').textContent = tab === 'project' ? 'My Projects' : 'My Articles';
    techList = [];
    document.getElementById('techPreview').innerHTML = '';
    renderList();
}

// ── TECH TAGS ──
let techList = [];
function addTech() {
    const val = document.getElementById('techInput').value.trim();
    if (!val || techList.includes(val)) return;
    techList.push(val);
    document.getElementById('techInput').value = '';
    renderTechPreview();
}
function removeTech(t) {
    techList = techList.filter(x => x !== t);
    renderTechPreview();
}
function renderTechPreview() {
    document.getElementById('techPreview').innerHTML = techList.map(t =>
        `<span class="tech-tag-pill">${t}<button onclick="removeTech('${t}')">×</button></span>`
    ).join('');
}

// ── STORAGE ──
function getCustomProjects() {
    try { return JSON.parse(localStorage.getItem('customProjects') || '[]'); } catch { return []; }
}
function getCustomArticles() {
    try { return JSON.parse(localStorage.getItem('customArticles') || '[]'); } catch { return []; }
}
function saveProjects(data) { localStorage.setItem('customProjects', JSON.stringify(data)); }
function saveArticles(data) { localStorage.setItem('customArticles', JSON.stringify(data)); }

// ── PUBLISH ──
function publishProject() {
    const title = document.getElementById('pTitle').value.trim();
    const desc  = document.getElementById('pDesc').value.trim();
    const type  = document.getElementById('pType').value;
    const icon  = document.getElementById('pIcon').value.trim() || '📁';
    const problem  = document.getElementById('pProblem').value.trim();
    const solution = document.getElementById('pSolution').value.trim();
    const result   = document.getElementById('pResult').value.trim();

    if (!title || !desc) { showToast('제목과 설명을 입력해주세요.', 'error'); return; }

    const projects = getCustomProjects();
    const newItem = {
        id: 'c' + Date.now(),
        title, desc, type, icon,
        tech: [...techList],
        problem: problem || '—',
        solution: solution || '—',
        result: result || '—',
        createdAt: new Date().toLocaleDateString('ko-KR')
    };
    projects.unshift(newItem);
    saveProjects(projects);

    // reset
    ['pTitle','pDesc','pProblem','pSolution','pResult','pIcon'].forEach(id => document.getElementById(id).value = '');
    techList = [];
    document.getElementById('techPreview').innerHTML = '';
    document.getElementById('pType').value = 'aviation';

    showToast('✅ 프로젝트가 등록되었습니다!');
    renderList();
}

function publishArticle() {
    const title    = document.getElementById('aTitle').value.trim();
    const excerpt  = document.getElementById('aExcerpt').value.trim();
    const body     = document.getElementById('articleBody').value.trim();
    const category = document.getElementById('aCategory').value;
    const readTime = document.getElementById('aReadTime').value.trim() || '3분';

    if (!title || !excerpt || !body) { showToast('제목, 요약, 본문을 입력해주세요.', 'error'); return; }

    const articles = getCustomArticles();
    const newItem = {
        id: 'c' + Date.now(),
        title, excerpt, body, category, readTime,
        date: new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })
    };
    articles.unshift(newItem);
    saveArticles(articles);

    ['aTitle','aExcerpt','articleBody','aReadTime'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('aCategory').value = 'insight';

    showToast('✅ 아티클이 등록되었습니다!');
    renderList();
}

// ── DELETE ──
function deleteProject(id) {
    if (!confirm('이 프로젝트를 삭제할까요?')) return;
    saveProjects(getCustomProjects().filter(p => p.id !== id));
    renderList();
    showToast('🗑 삭제되었습니다.');
}
function deleteArticle(id) {
    if (!confirm('이 아티클을 삭제할까요?')) return;
    saveArticles(getCustomArticles().filter(a => a.id !== id));
    renderList();
    showToast('🗑 삭제되었습니다.');
}

// ── RENDER LIST ──
function renderList() {
    const container = document.getElementById('postList');
    const countEl   = document.getElementById('listCount');

    if (currentTab === 'project') {
        const items = getCustomProjects();
        countEl.textContent = items.length;
        if (!items.length) {
            container.innerHTML = '<div class="empty-state">아직 작성한 프로젝트가 없습니다.</div>';
            return;
        }
        container.innerHTML = items.map(p => `
            <div class="post-item">
                <div class="post-item-top">
                    <span class="post-badge badge-${p.type}">${{aviation:'Aviation',ai:'AI/ML',data:'Data'}[p.type]}</span>
                    <button class="delete-btn" onclick="deleteProject('${p.id}')">삭제</button>
                </div>
                <div class="post-title">${p.icon} ${p.title}</div>
                <div class="post-meta">${p.createdAt} · 기술: ${p.tech.join(', ') || '없음'}</div>
            </div>
        `).join('');
    } else {
        const items = getCustomArticles();
        countEl.textContent = items.length;
        if (!items.length) {
            container.innerHTML = '<div class="empty-state">아직 작성한 아티클이 없습니다.</div>';
            return;
        }
        container.innerHTML = items.map(a => `
            <div class="post-item">
                <div class="post-item-top">
                    <span class="post-badge badge-${a.category}">${a.category === 'review' ? 'Paper Review' : 'Insight'}</span>
                    <button class="delete-btn" onclick="deleteArticle('${a.id}')">삭제</button>
                </div>
                <div class="post-title">${a.title}</div>
                <div class="post-meta">${a.date} · ${a.readTime} 읽기</div>
            </div>
        `).join('');
    }
}

// ── TOAST ──
function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = type === 'error' ? 'var(--red)' : 'var(--green)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
