<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate | HoJin Choi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Certificate 전용 스타일 ── */
        .cert-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            width: 320px;
            flex-shrink: 0;
        }
        .cert-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-color);
        }
        .cert-image-wrap {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #0f172a, #1e3a5f);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        .cert-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .cert-image-wrap:hover img { transform: scale(1.04); }
        .cert-image-placeholder {
            font-size: 4rem;
            color: #334155;
        }
        .cert-image-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            opacity: 0;
        }
        .cert-image-wrap:hover .cert-image-overlay {
            background: rgba(0,0,0,0.45);
            opacity: 1;
        }
        .cert-body { padding: 1.5rem; flex-grow: 1; }
        .cert-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.9rem;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .platform-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .platform-coursera  { background: rgba(0, 86, 210, 0.25); color: #60a5fa; }
        .platform-udemy     { background: rgba(236, 72, 153, 0.2); color: #f472b6; }
        .platform-google    { background: rgba(234, 67, 53, 0.2);  color: #f87171; }
        .platform-microsoft { background: rgba(0, 164, 239, 0.2);  color: #38bdf8; }
        .platform-aws       { background: rgba(255, 153, 0, 0.2);  color: #fbbf24; }
        .platform-uts       { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .platform-other     { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }
        .platform-custom    { background: rgba(96, 165, 250, 0.15); color: #93c5fd; }

        .cert-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.5rem; line-height: 1.4; }
        .cert-issuer { font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 0.4rem; }
        .cert-issued { font-size: 0.82rem; color: #475569; }
        .cert-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.75rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 모달 이미지 뷰어 */
        .img-viewer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .img-viewer-overlay.active { display: flex; }
        .img-viewer-overlay img {
            max-width: 90vw;
            max-height: 88vh;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            object-fit: contain;
        }
        .img-viewer-close {
            position: fixed;
            top: 1.25rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: #e2e8f0;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        /* 글쓰기 폼 추가 요소 */
        .cert-img-preview {
            width: 100%;
            max-height: 240px;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 0.75rem;
            display: none;
            border: 1px solid #334155;
        }
        .cert-upload-btn {
            width: 100%;
            padding: 0.9rem;
            background: #1e293b;
            border: 2px dashed #334155;
            border-radius: 8px;
            color: #64748b;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            margin-top: 0.5rem;
        }
        .cert-upload-btn:hover { border-color: var(--aviation-blue); color: var(--accent-color); }
        .cert-img-input { display: none; }

        /* 빈 상태 */
        .empty-state {
            text-align: center;
            padding: 5rem 1.5rem;
            grid-column: 1 / -1;
        }
        .empty-state .empty-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.3; }
        .empty-state p { color: var(--text-secondary); font-size: 0.95rem; }
    </style>
</head>

<!-- 데이터 저장 영역 -->
<!--__CERTS_DATA_START__
[{"id":"cert_1774689500651","title":"Generative AI for Digital Marketing  Specialization","platform":"Coursera","issuer":"IBM","issuedDate":"2026-03-28","url":"https://www.coursera.org/account/accomplishments/specialization/KI1BGXZ8W9EM","desc":"","imgUrl":"https://Gansaw.github.io/website/assets/certificates/cert_1774689496626.png","date":"2026. 3. 28.","time":"오후 06:18"},{"id":"cert_1774111191699","title":"DATA ANALYTICS FOUNDATIONS","platform":"UTS","issuer":"University of Technology Sydney","issuedDate":"2023-01-05","url":"","desc":"","imgUrl":"https://Gansaw.github.io/website/assets/certificates/cert_1774111949644.png","date":"2026. 3. 22.","time":"오전 01:52"}]

<script>
/* ── GitHub 설정 ── */
const GH_OWNER  = 'Gansaw';
const GH_REPO   = 'website';
const GH_FILE   = 'certificate.html';
const GH_BRANCH = 'main';
const TOKEN_KEY = 'gh_token_portfolio';

const DATA_START_MARKER = '<!--__CERTS_DATA_START__';
const DATA_END_MARKER   = '__CERTS_DATA_END__-->';

let CERTS = [];
let currentFilter = 'all';
let editingId = null;
let pendingImgBase64 = null;
let pendingImgName = '';

/* ════════════════════════════════════════════
   데이터 로드
════════════════════════════════════════════ */
function loadCerts() {
    try {
        const html = document.documentElement.outerHTML;
        const startIdx = html.indexOf(DATA_START_MARKER);
        const endIdx = html.indexOf(DATA_END_MARKER);
        if (startIdx !== -1 && endIdx !== -1) {
            const jsonStr = html.substring(startIdx + DATA_START_MARKER.length, endIdx).trim();
            CERTS = JSON.parse(jsonStr);
        }
    } catch (e) {
        console.error('데이터 로드 오류:', e);
        CERTS = [];
    }
}

/* ════════════════════════════════════════════
   이미지 선택
════════════════════════════════════════════ */
function handleImgSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    pendingImgName = file.name;
    document.getElementById('certImgName').textContent = '📎 ' + file.name;
    const reader = new FileReader();
    reader.onload = (e) => {
        pendingImgBase64 = e.target.result; // data:image/...;base64,...
        const preview = document.getElementById('certImgPreview');
        if (file.type.startsWith('image/')) {
            preview.src = pendingImgBase64;
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
        }
    };
    reader.readAsDataURL(file);
}

/* ════════════════════════════════════════════
   이미지 뷰어
════════════════════════════════════════════ */
function openImgViewer(src) {
    document.getElementById('imgViewerSrc').src = src;
    document.getElementById('imgViewer').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeImgViewer() {
    document.getElementById('imgViewer').classList.remove('active');
    document.body.style.overflow = '';
}

/* ════════════════════════════════════════════
   토큰 관리
════════════════════════════════════════════ */
function getToken()  { return localStorage.getItem(TOKEN_KEY) || ''; }
function saveToken() {
    const t = document.getElementById('tokenInput').value.trim();
    if (!t) { showToast('토큰을 입력해주세요.', true); return; }
    localStorage.setItem(TOKEN_KEY, t);
    closeTokenModal();
    updateTokenIndicator();
    showToast('✅ 토큰이 저장됐습니다.');
}
function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById('tokenInput').value = '';
    updateTokenIndicator();
    showToast('🗑 토큰이 삭제됐습니다.');
}
function updateTokenIndicator() {
    document.querySelector('.fab-token').style.borderColor = getToken() ? '#10b981' : '#1e3a5f';
}
function openTokenModal() {
    document.getElementById('tokenInput').value = getToken();
    document.getElementById('tokenOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeTokenModal() {
    document.getElementById('tokenOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

/* ════════════════════════════════════════════
   GitHub API 헬퍼
════════════════════════════════════════════ */
async function ghGet(token) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`,
        { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
    );
    if (!res.ok) throw new Error(`GitHub API 오류: ${res.status} — 토큰을 확인해주세요.`);
    return res.json();
}
async function ghPut(token, sha, newContent, message) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`,
        {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(newContent))), sha, branch: GH_BRANCH })
        }
    );
    if (!res.ok) { const err = await res.json(); throw new Error(err.message || `GitHub 커밋 실패: ${res.status}`); }
    return res.json();
}

/* 이미지를 GitHub에 별도 파일로 업로드 */
async function ghUploadImage(token, base64DataUrl, filename) {
    // data:image/png;base64,XXXX → XXXX
    const base64 = base64DataUrl.split(',')[1];
    const ext = base64DataUrl.split(';')[0].split('/')[1] || 'jpg';
    const safeFilename = filename.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = `assets/certificates/${safeFilename}`;

    // 기존 파일 sha 확인 (덮어쓰기용)
    let sha = undefined;
    try {
        const chk = await fetch(
            `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}?ref=${GH_BRANCH}`,
            { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
        );
        if (chk.ok) { const j = await chk.json(); sha = j.sha; }
    } catch (_) {}

    const body = { message: `📎 Upload certificate image: ${safeFilename}`, content: base64, branch: GH_BRANCH };
    if (sha) body.sha = sha;

    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`,
        {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        }
    );
    if (!res.ok) { const err = await res.json(); throw new Error(err.message || `이미지 업로드 실패`); }
    // GitHub Pages URL 반환
    return `https://${GH_OWNER}.github.io/${GH_REPO}/${path}`;
}

function injectJSON(fileText, newJSON) {
    const startIdx = fileText.indexOf(DATA_START_MARKER);
    const endIdx = fileText.indexOf(DATA_END_MARKER);
    if (startIdx === -1 || endIdx === -1) throw new Error('데이터 마커를 찾을 수 없습니다.');
    return fileText.slice(0, startIdx + DATA_START_MARKER.length) + '\n' + newJSON + '\n' + fileText.slice(endIdx);
}

function getCurrentDateTime() {
    const now = new Date();
    const date = now.toLocaleDateString('ko-KR');
    const time = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    return { date, time };
}

/* ════════════════════════════════════════════
   렌더
════════════════════════════════════════════ */
function renderCards(filter) {
    currentFilter = 'all';
    const list = CERTS;
    const grid = document.getElementById('certsGrid');

    if (list.length === 0) {
        grid.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">🎓</div>
                <p>아직 등록된 수료증이 없습니다.<br>우측 하단 🎓 버튼으로 첫 수료증을 등록해보세요!</p>
            </div>`;
        return;
    }

    grid.innerHTML = list.map(c => {
        const imgHtml = c.imgUrl
            ? `<div class="cert-image-wrap" onclick="openImgViewer('${c.imgUrl}')">
                   <img src="${c.imgUrl}" alt="${c.title}" loading="lazy">
                   <div class="cert-image-overlay">🔍 크게 보기</div>
               </div>`
            : `<div class="cert-image-wrap" style="cursor:default;">
                   <span class="cert-image-placeholder">🎓</span>
               </div>`;
        const urlBtn = c.url
            ? `<a href="${c.url}" target="_blank" rel="noopener" class="view-hint" style="text-decoration:none;" onclick="event.stopPropagation();">Verify →</a>`
            : `<span></span>`;
        return `
        <div class="cert-card">
            ${imgHtml}
            <div class="cert-body">
                <div class="cert-meta">
                    <span class="platform-badge platform-custom">${c.platform || 'Other'}</span>
                    <span class="card-date">${c.issuedDate || c.date}</span>
                </div>
                <div class="cert-title">${c.title}</div>
                ${c.issuer ? `<div class="cert-issuer">🏛 ${c.issuer}</div>` : ''}
                ${c.desc ? `<div class="cert-desc">${c.desc}</div>` : ''}
            </div>
            <div class="card-footer-bar">
                ${urlBtn}
                <div class="card-actions">
                    <button class="edit-btn" onclick="editCert('${c.id}'); event.stopPropagation();">Edit</button>
                    <button class="delete-btn" onclick="deleteCert('${c.id}'); event.stopPropagation();">Delete</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

/* ════════════════════════════════════════════
   글쓰기 / 수정
════════════════════════════════════════════ */
function resetForm() {
    document.getElementById('cTitle').value = '';
    document.getElementById('cPlatform').value = '';
    document.getElementById('cIssuer').value = '';
    document.getElementById('cIssuedDate').value = '';
    document.getElementById('cUrl').value = '';
    document.getElementById('cDesc').value = '';
    document.getElementById('certImgPreview').style.display = 'none';
    document.getElementById('certImgPreview').src = '';
    document.getElementById('certImgName').textContent = '';
    document.getElementById('certImgInput').value = '';
    pendingImgBase64 = null;
    pendingImgName = '';
}

function openWrite() {
    if (!getToken()) {
        showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true);
        setTimeout(openTokenModal, 1000);
        return;
    }
    editingId = null;
    document.getElementById('writeModalTitle').textContent = '🎓 새 수료증 등록';
    document.getElementById('publishBtn').textContent = '📤 GitHub에 등록';
    resetForm();
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function editCert(id) {
    if (!getToken()) {
        showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true);
        setTimeout(openTokenModal, 1000);
        return;
    }
    const c = CERTS.find(x => x.id === id);
    if (!c) return;
    editingId = id;
    document.getElementById('writeModalTitle').textContent = '✏️ 수료증 수정';
    document.getElementById('publishBtn').textContent = '💾 GitHub에 저장';
    resetForm();
    document.getElementById('cTitle').value = c.title;
    document.getElementById('cPlatform').value = c.platform;
    document.getElementById('cIssuer').value = c.issuer || '';
    document.getElementById('cIssuedDate').value = c.issuedDate || '';
    document.getElementById('cUrl').value = c.url || '';
    document.getElementById('cDesc').value = c.desc || '';
    if (c.imgUrl) {
        const preview = document.getElementById('certImgPreview');
        preview.src = c.imgUrl;
        preview.style.display = 'block';
        document.getElementById('certImgName').textContent = '📎 기존 이미지 사용 중';
    }
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeWrite() {
    document.getElementById('writeOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

/* ════════════════════════════════════════════
   발행
════════════════════════════════════════════ */
async function publishCert() {
    const title = document.getElementById('cTitle').value.trim();
    const platform = document.getElementById('cPlatform').value;
    const issuer = document.getElementById('cIssuer').value.trim();
    const issuedDate = document.getElementById('cIssuedDate').value;
    const url = document.getElementById('cUrl').value.trim();
    const desc = document.getElementById('cDesc').value.trim();

    if (!title || !issuedDate) {
        showToast('제목과 발급일을 입력해주세요.', true);
        return;
    }

    const token = getToken();
    if (!token) { showToast('GitHub 토큰을 설정해주세요.', true); openTokenModal(); return; }

    const btn = document.getElementById('publishBtn');
    btn.disabled = true;
    btn.textContent = '⏳ 업로드 중...';
    showToast('⏳ 처리 중...');

    try {
        let imgUrl = null;

        // 이미지 업로드
        if (pendingImgBase64) {
            showToast('⏳ 이미지 업로드 중...');
            const ts = Date.now();
            const ext = pendingImgBase64.split(';')[0].split('/')[1] || 'jpg';
            const fname = `cert_${ts}.${ext}`;
            imgUrl = await ghUploadImage(token, pendingImgBase64, fname);
        } else if (editingId) {
            const existing = CERTS.find(c => c.id === editingId);
            imgUrl = existing ? existing.imgUrl : null;
        }

        const data = await ghGet(token);
        const fileText = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        const { date, time } = getCurrentDateTime();

        if (editingId) {
            const idx = CERTS.findIndex(c => c.id === editingId);
            if (idx !== -1) {
                CERTS[idx] = { ...CERTS[idx], title, platform, issuer, issuedDate, url, desc, imgUrl, date, time };
            }
        } else {
            const newId = 'cert_' + Date.now();
            CERTS.unshift({ id: newId, title, platform, issuer, issuedDate, url, desc, imgUrl, date, time });
        }

        const newJSON = JSON.stringify(CERTS);
        const newContent = injectJSON(fileText, newJSON);
        const msg = editingId ? `✏️ Edit certificate: ${title}` : `✍️ Add certificate: ${title}`;
        await ghPut(token, data.sha, newContent, msg);

        closeWrite();
        showToast('✅ GitHub에 등록되었습니다! 잠시 후 사이트가 업데이트됩니다.');
        setTimeout(() => location.reload(), 2500);
    } catch (err) {
        showToast(`❌ 오류: ${err.message}`, true);
        btn.disabled = false;
        btn.textContent = editingId ? '💾 GitHub에 저장' : '📤 GitHub에 등록';
    }
}

/* ════════════════════════════════════════════
   삭제
════════════════════════════════════════════ */
function deleteCert(id) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    const token = getToken();
    if (!token) { showToast('GitHub Token이 없습니다. 🔑 버튼으로 설정해주세요.', true); return; }
    showToast('⏳ 삭제 중...');
    const idx = CERTS.findIndex(c => c.id === id);
    if (idx === -1) return;
    const removed = CERTS[idx];
    ghGet(token).then(data => {
        const fileText = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        CERTS.splice(idx, 1);
        const newJSON = JSON.stringify(CERTS);
        const newContent = injectJSON(fileText, newJSON);
        return ghPut(token, data.sha, newContent, `🗑 Delete certificate: ${removed.title}`);
    }).then(() => {
        renderCards(currentFilter);
        showToast('🗑 삭제됐습니다! 잠시 후 사이트가 업데이트됩니다.');
        setTimeout(() => location.reload(), 3000);
    }).catch(err => showToast('❌ ' + err.message, true));
}

/* ════════════════════════════════════════════
   필터 & 토스트
════════════════════════════════════════════ */
function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.toggle('error', isError);
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

/* ════════════════════════════════════════════
   초기화
════════════════════════════════════════════ */
loadCerts();
renderCards('all');
updateTokenIndicator();
</script>
