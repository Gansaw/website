<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study | HoJin Choi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .cat-ml      { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .cat-stats   { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .cat-dl      { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .cat-python  { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .cat-math    { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .cat-other   { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }

        /* file upload */
        .file-upload-section { margin-top: 1rem; }
        .file-upload-label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: var(--accent-color); text-transform: uppercase; letter-spacing: 0.05em; }
        .file-upload-btn { width: 100%; padding: 0.9rem; background: #1e293b; border: 2px dashed #334155; border-radius: 8px; color: #64748b; font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease; text-align: center; }
        .file-upload-btn:hover { border-color: var(--aviation-blue); color: var(--accent-color); }
        .file-upload-input { display: none; }
        .file-list { margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .file-item { background: #1e293b; padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.85rem; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .file-item button { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.9rem; }
        .wm-hint { font-size: 0.8rem; color: #475569; margin-top: 0.4rem; }
    </style>
</head>
<body>

<!-- 리스트 뷰 -->
<div id="listView" style="padding-top:0;">
    <div class="page-hero">
        <h1>Study</h1>
        <p>공부하면서 정리한 개념, 알고리즘, 코드 노트</p>
    </div>
    <div style="display:flex; justify-content:center; gap:0.75rem; padding:0.75rem 1rem 0; flex-wrap:wrap;">
        <a href="index.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">← Home</a>
        <a href="project.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Project</a>
        <a href="article.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Article</a>
        <a href="certificate.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Certificate</a>
        <a href="diary.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Diary</a>
    </div>
    <div class="filters">
        <button class="filter-btn active" onclick="filterStudy('all',this)">All</button>
        <button class="filter-btn" onclick="filterStudy('ml',this)">ML</button>
        <button class="filter-btn" onclick="filterStudy('dl',this)">DL</button>
        <button class="filter-btn" onclick="filterStudy('stats',this)">Statistics</button>
        <button class="filter-btn" onclick="filterStudy('python',this)">Python</button>
        <button class="filter-btn" onclick="filterStudy('math',this)">Math</button>
        <button class="filter-btn" onclick="filterStudy('other',this)">Other</button>
    </div>
    <div class="articles-grid" id="studyGrid"></div>
</div>

<!-- 디테일 뷰 -->
<div id="detailView">
    <button class="back-btn" onclick="backToList()">← 목록으로</button>
    <div id="detailContent"></div>
</div>

<!-- 글쓰기/수정 모달 -->
<div class="write-overlay" id="writeOverlay">
    <div class="write-modal">
        <div class="write-modal-header">
            <h2 id="writeModalTitle">📚 새 스터디 노트 작성</h2>
            <button class="write-modal-close" onclick="closeWrite()">&#10005;</button>
        </div>

        <label class="wm-label">제목 *</label>
        <input id="sTitle" type="text" class="wm-input" placeholder="e.g. Transformer 어텐션 메커니즘 정리">

        <div class="wm-row">
            <div>
                <label class="wm-label">카테고리</label>
                <select id="sCategory" class="wm-select">
                    <option value="ml">ML</option>
                    <option value="dl">DL</option>
                    <option value="stats">Statistics</option>
                    <option value="python">Python</option>
                    <option value="math">Math</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>

        <label class="wm-label">요약 (카드 미리보기) *</label>
        <textarea id="sExcerpt" class="wm-textarea" rows="3" placeholder="카드에 표시될 짧은 요약 (2~3줄)..."></textarea>

        <!-- Quill 에디터 -->
        <label class="wm-label">본문 * <span style="font-weight:400; color:#475569; text-transform:none; letter-spacing:0;">(시각적 편집)</span></label>
        <div class="editor-container">
            <div id="sBodyEditor" style="background:#1e293b; border-radius:8px;"></div>
        </div>

        <!-- 첨부파일 -->
        <div class="file-upload-section">
            <label class="file-upload-label">첨부파일 (선택)</label>
            <button type="button" class="file-upload-btn" onclick="document.getElementById('fileInput').click()">
                📎 파일 선택
            </button>
            <input id="fileInput" type="file" class="file-upload-input" multiple onchange="handleFileSelect(event)">
            <div class="file-list" id="fileList"></div>
        </div>

        <button class="wm-submit" id="publishBtn" onclick="publishStudy()">📤 GitHub에 등록</button>
    </div>
</div>

<!-- 토큰 설정 모달 -->
<div class="write-overlay" id="tokenOverlay">
    <div class="write-modal" style="max-width:480px;">
        <div class="write-modal-header">
            <h2>🔑 GitHub Token 설정</h2>
            <button class="write-modal-close" onclick="closeTokenModal()">&#10005;</button>
        </div>
        <p style="font-size:0.9rem; color:#94a3b8; margin-bottom:1.5rem; line-height:1.6;">
            GitHub에 글을 발행하려면 Personal Access Token이 필요합니다.<br>
            토큰은 이 브라우저에만 저장되며 외부로 전송되지 않습니다.
        </p>
        <label class="wm-label">Personal Access Token
            <a href="https://github.com/settings/tokens/new?scopes=repo&description=portfolio-write"
               target="_blank"
               style="font-weight:400; color:#60a5fa; text-transform:none; letter-spacing:0; margin-left:0.5rem;">
               발급하러 가기 →
            </a>
        </label>
        <input id="tokenInput" type="password" class="wm-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        <p class="wm-hint">repo 권한 체크 후 발급 · 페이지를 닫아도 유지됩니다</p>
        <button class="wm-submit" onclick="saveToken()">💾 저장</button>
        <button onclick="clearToken()" style="width:100%; margin-top:0.6rem; padding:0.6rem; background:transparent; border:1px solid #334155; border-radius:8px; color:#64748b; font-family:inherit; font-size:0.85rem; cursor:pointer;">
            저장된 토큰 삭제
        </button>
    </div>
</div>

<!-- FAB 그룹 -->
<div class="fab-group">
    <button class="fab fab-token" onclick="openTokenModal()" title="GitHub Token 설정">🔑</button>
    <button class="fab fab-write" onclick="openWrite()" title="새 스터디 노트 작성">📚</button>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<!-- 데이터 저장 영역 -->
<!--__STUDY_DATA_START__
[]
__STUDY_DATA_END__-->

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
/* ── GitHub 설정 ── */
const GH_OWNER  = 'Gansaw';
const GH_REPO   = 'website';
const GH_FILE   = 'study.html';
const GH_BRANCH = 'main';
const TOKEN_KEY = 'gh_token_study';

const DATA_START_MARKER = '<!--__STUDY_DATA_START__';
const DATA_END_MARKER   = '__STUDY_DATA_END__-->';

let STUDIES = [];
let currentFilter = 'all';
let editingId = null;
let quillEditor = null;
let attachedFiles = [];

const CAT_LABEL = { ml:'ML', dl:'DL', stats:'Statistics', python:'Python', math:'Math', other:'Other' };

/* ════════════════════════════════════════════
   데이터 로드
════════════════════════════════════════════ */
function loadStudies() {
    try {
        const html = document.documentElement.outerHTML;
        const startIdx = html.indexOf(DATA_START_MARKER);
        const endIdx = html.indexOf(DATA_END_MARKER);
        if (startIdx !== -1 && endIdx !== -1) {
            const jsonStr = html.substring(startIdx + DATA_START_MARKER.length, endIdx).trim();
            STUDIES = JSON.parse(jsonStr);
        }
    } catch (e) { console.error('데이터 로드 오류:', e); STUDIES = []; }
}

/* ════════════════════════════════════════════
   Quill 에디터 초기화
════════════════════════════════════════════ */
function initQuillEditor() {
    if (!quillEditor) {
        quillEditor = new Quill('#sBodyEditor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline', 'strike'],
                    ['blockquote', 'code-block'],
                    [{ 'header': 1 }, { 'header': 2 }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'indent': '-1'}, { 'indent': '+1' }],
                    [{ 'size': ['small', false, 'large', 'huge'] }],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'align': [] }],
                    ['link'],
                    ['clean']
                ]
            },
            placeholder: '공부 내용을 정리해보세요...'
        });
    }
}

/* ════════════════════════════════════════════
   파일 업로드
════════════════════════════════════════════ */
function handleFileSelect(event) {
    for (let file of event.target.files) { attachedFiles.push(file); renderFileList(); }
}
function removeFile(index) { attachedFiles.splice(index, 1); renderFileList(); }
function renderFileList() {
    document.getElementById('fileList').innerHTML = attachedFiles.map((f, i) =>
        `<div class="file-item">📄 ${f.name}<button type="button" onclick="removeFile(${i})">✕</button></div>`
    ).join('');
}

/* ════════════════════════════════════════════
   토큰 관리
════════════════════════════════════════════ */
function getToken()  { return localStorage.getItem(TOKEN_KEY) || ''; }
function saveToken() {
    const t = document.getElementById('tokenInput').value.trim();
    if (!t) { showToast('토큰을 입력해주세요.', true); return; }
    localStorage.setItem(TOKEN_KEY, t);
    closeTokenModal(); updateTokenIndicator(); showToast('✅ 토큰이 저장됐습니다.');
}
function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById('tokenInput').value = '';
    updateTokenIndicator(); showToast('🗑 토큰이 삭제됐습니다.');
}
function updateTokenIndicator() {
    document.querySelector('.fab-token').style.borderColor = getToken() ? '#10b981' : '#1e3a5f';
}
function openTokenModal() {
    document.getElementById('tokenInput').value = getToken();
    document.getElementById('tokenOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeTokenModal() {
    document.getElementById('tokenOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

/* ════════════════════════════════════════════
   GitHub API 헬퍼
════════════════════════════════════════════ */
async function ghGet(token) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`,
        { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
    );
    if (!res.ok) throw new Error(`GitHub API 오류: ${res.status} — 토큰을 확인해주세요.`);
    return res.json();
}
async function ghPut(token, sha, newContent, message) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`,
        {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(newContent))), sha, branch: GH_BRANCH })
        }
    );
    if (!res.ok) { const err = await res.json(); throw new Error(err.message || `GitHub 커밋 실패: ${res.status}`); }
    return res.json();
}
function injectJSON(fileText, newJSON) {
    const s = fileText.indexOf(DATA_START_MARKER);
    const e = fileText.indexOf(DATA_END_MARKER);
    if (s === -1 || e === -1) throw new Error('데이터 마커를 찾을 수 없습니다.');
    return fileText.slice(0, s + DATA_START_MARKER.length) + '\n' + newJSON + '\n' + fileText.slice(e);
}
function getCurrentDateTime() {
    const now = new Date();
    return { date: now.toLocaleDateString('ko-KR'), time: now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) };
}

/* ════════════════════════════════════════════
   렌더
════════════════════════════════════════════ */
function renderCards(filter) {
    currentFilter = filter;
    const list = filter === 'all' ? STUDIES : STUDIES.filter(s => s.category === filter);
    document.getElementById('studyGrid').innerHTML = list.length === 0
        ? `<p style="color:#64748b;text-align:center;padding:3rem;grid-column:1/-1;">아직 등록된 스터디 노트가 없습니다.</p>`
        : list.map(s => `
            <div class="article-card">
                <div class="card-body" onclick="showDetail('${s.id}')">
                    <div class="card-meta">
                        <span class="cat-badge cat-${s.category}">${CAT_LABEL[s.category] || s.category}</span>
                        <span class="card-date">${s.date} ${s.time}</span>
                    </div>
                    <h3 class="card-title">${s.title}</h3>
                    <p class="card-excerpt">${s.excerpt}</p>
                </div>
                <div class="card-footer-bar">
                    <span class="view-hint" onclick="showDetail('${s.id}')">View Details →</span>
                    <div class="card-actions">
                        <button class="edit-btn" onclick="editStudy('${s.id}'); event.stopPropagation();">Edit</button>
                        <button class="delete-btn" onclick="deleteStudy('${s.id}'); event.stopPropagation();">Delete</button>
                    </div>
                </div>
            </div>`
        ).join('');
}

function showDetail(id) {
    const s = STUDIES.find(x => x.id === id);
    if (!s) return;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    document.getElementById('detailContent').innerHTML = `
        <div class="detail-meta">${s.date} ${s.time}</div>
        <h1>${s.title}</h1>
        ${s.body}`;
}
function backToList() {
    document.getElementById('listView').style.display = 'block';
    document.getElementById('detailView').style.display = 'none';
}

/* ════════════════════════════════════════════
   글쓰기/수정
════════════════════════════════════════════ */
function openWrite() {
    if (!getToken()) { showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true); setTimeout(openTokenModal, 1000); return; }
    editingId = null;
    document.getElementById('writeModalTitle').textContent = '📚 새 스터디 노트 작성';
    document.getElementById('publishBtn').textContent = '📤 GitHub에 등록';
    document.getElementById('sTitle').value = '';
    document.getElementById('sCategory').value = 'ml';
    document.getElementById('sExcerpt').value = '';
    attachedFiles = []; renderFileList();
    initQuillEditor(); quillEditor.setContents([]);
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function editStudy(id) {
    if (!getToken()) { showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true); setTimeout(openTokenModal, 1000); return; }
    const s = STUDIES.find(x => x.id === id);
    if (!s) return;
    editingId = id;
    document.getElementById('writeModalTitle').textContent = '✏️ 스터디 노트 수정';
    document.getElementById('publishBtn').textContent = '💾 GitHub에 저장';
    document.getElementById('sTitle').value = s.title;
    document.getElementById('sCategory').value = s.category;
    document.getElementById('sExcerpt').value = s.excerpt;
    attachedFiles = []; renderFileList();
    initQuillEditor(); quillEditor.root.innerHTML = s.body;
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeWrite() {
    document.getElementById('writeOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

async function publishStudy() {
    const title    = document.getElementById('sTitle').value.trim();
    const category = document.getElementById('sCategory').value;
    const excerpt  = document.getElementById('sExcerpt').value.trim();
    const body     = quillEditor.root.innerHTML;

    if (!title || !excerpt || !body.replace(/<[^>]*>/g, '').trim()) {
        showToast('제목, 요약, 본문을 모두 입력해주세요.', true); return;
    }
    const token = getToken();
    if (!token) { showToast('GitHub 토큰을 설정해주세요.', true); openTokenModal(); return; }

    try {
        const btn = document.getElementById('publishBtn');
        btn.disabled = true; btn.textContent = '⏳ GitHub에 업로드 중...';
        showToast('⏳ 처리 중...');
        const data = await ghGet(token);
        const fileText = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        const { date, time } = getCurrentDateTime();

        if (editingId) {
            const idx = STUDIES.findIndex(s => s.id === editingId);
            if (idx !== -1) STUDIES[idx] = { ...STUDIES[idx], title, category, excerpt, body, date, time };
        } else {
            STUDIES.unshift({ id: 's' + Date.now(), category, date, time, title, excerpt, body });
        }

        const newContent = injectJSON(fileText, JSON.stringify(STUDIES));
        const msg = editingId ? `✏️ Edit study: ${title}` : `✍️ Add study: ${title}`;
        await ghPut(token, data.sha, newContent, msg);
        closeWrite();
        showToast('✅ GitHub에 등록되었습니다! 잠시 후 사이트가 업데이트됩니다.');
        setTimeout(() => location.reload(), 2000);
    } catch (err) {
        showToast(`❌ 오류: ${err.message}`, true);
        const btn = document.getElementById('publishBtn');
        btn.disabled = false;
        btn.textContent = editingId ? '💾 GitHub에 저장' : '📤 GitHub에 등록';
    }
}

function deleteStudy(id) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    const token = getToken();
    if (!token) { showToast('GitHub Token이 없습니다.', true); return; }
    showToast('⏳ 삭제 중...');
    const idx = STUDIES.findIndex(s => s.id === id);
    if (idx === -1) return;
    const removed = STUDIES[idx];
    ghGet(token).then(data => {
        const fileText = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        STUDIES.splice(idx, 1);
        const newContent = injectJSON(fileText, JSON.stringify(STUDIES));
        return ghPut(token, data.sha, newContent, `🗑 Delete study: ${removed.title}`);
    }).then(() => {
        renderCards(currentFilter);
        showToast('🗑 삭제됐습니다!');
        setTimeout(() => location.reload(), 3000);
    }).catch(err => showToast('❌ ' + err.message, true));
}

/* ════════════════════════════════════════════
   필터 & 토스트
════════════════════════════════════════════ */
function filterStudy(cat, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(cat);
}
function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.toggle('error', isError);
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

/* ════════════════════════════════════════════
   초기화
════════════════════════════════════════════ */
loadStudies();
renderCards('all');
updateTokenIndicator();
</script>
</body>
</html>
