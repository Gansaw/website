<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | HoJin Choi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 리스트 뷰 -->
<div id="listView" style="padding-top:0;">
    <div class="page-hero">
        <h1>Article</h1>
        <p>AI · 데이터 분석 · 항공우주 산업 인사이트와 논문 리뷰</p>
    </div>

    <div style="display:flex; justify-content:center; padding:0.75rem 1rem 0;">
        <a href="index.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">← Back to Home</a>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="filterArticles('all',this)">All</button>
        <button class="filter-btn" onclick="filterArticles('insight',this)">Insight</button>
        <button class="filter-btn" onclick="filterArticles('review',this)">Paper Review</button>
    </div>

    <div class="articles-grid" id="articlesGrid"></div>
</div>

<!-- 디테일 뷰 -->
<div id="detailView">
    <button class="back-btn" onclick="backToList()">← 목록으로</button>
    <div id="detailContent"></div>
</div>

<!-- 글쓰기 모달 -->
<div class="write-overlay" id="writeOverlay">
    <div class="write-modal">
        <div class="write-modal-header">
            <h2>✍️ 새 아티클 작성</h2>
            <button class="write-modal-close" onclick="closeWrite()">&#10005;</button>
        </div>

        <label class="wm-label">제목 *</label>
        <input id="aTitle" type="text" class="wm-input" placeholder="e.g. LLM이 바꾸는 세상">

        <div class="wm-row">
            <div>
                <label class="wm-label">카테고리</label>
                <select id="aCategory" class="wm-select">
                    <option value="insight">Insight</option>
                    <option value="review">Paper Review</option>
                </select>
            </div>
            <div>
                <label class="wm-label">예상 읽기 시간</label>
                <input id="aReadTime" type="text" class="wm-input" placeholder="3분">
            </div>
        </div>

        <label class="wm-label">요약 (카드 미리보기) *</label>
        <textarea id="aExcerpt" class="wm-textarea" rows="3" placeholder="카드에 표시될 짧은 요약 (2~3줄)..."></textarea>

        <label class="wm-label">본문 * <span style="font-weight:400; color:#475569; text-transform:none; letter-spacing:0;">(HTML 태그 사용 가능)</span></label>
        <textarea id="aBody" class="wm-textarea mono" placeholder="<p>본문 내용</p>&#10;<h2>소제목</h2>&#10;<ul><li>항목</li></ul>"></textarea>
        <p class="wm-hint">지원 태그: &lt;p&gt; &lt;h2&gt; &lt;ul&gt; &lt;ol&gt; &lt;li&gt; &lt;strong&gt; &lt;em&gt; &lt;blockquote&gt; &lt;table&gt;</p>

        <button class="wm-submit" id="publishBtn" onclick="publishArticle()">📤 GitHub에 등록</button>
    </div>
</div>

<!-- 토큰 설정 모달 -->
<div class="write-overlay" id="tokenOverlay">
    <div class="write-modal" style="max-width:480px;">
        <div class="write-modal-header">
            <h2>🔑 GitHub Token 설정</h2>
            <button class="write-modal-close" onclick="closeTokenModal()">&#10005;</button>
        </div>
        <p style="font-size:0.9rem; color:#94a3b8; margin-bottom:1.5rem; line-height:1.6;">
            GitHub에 글을 발행하려면 Personal Access Token이 필요합니다.<br>
            토큰은 이 브라우저에만 저장되며 외부로 전송되지 않습니다.
        </p>
        <label class="wm-label">Personal Access Token
            <a href="https://github.com/settings/tokens/new?scopes=repo&description=portfolio-write"
               target="_blank"
               style="font-weight:400; color:#60a5fa; text-transform:none; letter-spacing:0; margin-left:0.5rem;">
               발급하러 가기 →
            </a>
        </label>
        <input id="tokenInput" type="password" class="wm-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        <p class="wm-hint">repo 권한 체크 후 발급 · 페이지를 닫아도 유지됩니다</p>
        <button class="wm-submit" onclick="saveToken()">💾 저장</button>
        <button onclick="clearToken()" style="width:100%; margin-top:0.6rem; padding:0.6rem; background:transparent; border:1px solid #334155; border-radius:8px; color:#64748b; font-family:inherit; font-size:0.85rem; cursor:pointer;">
            저장된 토큰 삭제
        </button>
    </div>
</div>

<!-- FAB 그룹 -->
<div class="fab-group">
    <button class="fab fab-token" onclick="openTokenModal()" title="GitHub Token 설정">🔑</button>
    <button class="fab fab-write" onclick="openWrite()" title="새 아티클 작성">✍️</button>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<style>
.fab-group { position:fixed; bottom:2rem; right:2rem; z-index:900; display:flex; flex-direction:column; gap:0.75rem; align-items:center; }
.fab-token { width:44px; height:44px; font-size:1.1rem; background:#1e293b; border:1.5px solid #1e3a5f; }
.fab-token:hover { background:#1e3a5f; transform:scale(1.08); }
.fab-write { width:56px; height:56px; font-size:1.5rem; }
</style>

<script>
/* ── GitHub 설정 ── */
const GH_OWNER  = 'Gansaw';
const GH_REPO   = 'website';
const GH_FILE   = 'article.html';
const GH_BRANCH = 'main';
const TOKEN_KEY = 'gh_token_portfolio';

const ARRAY_START = 'const ARTICLES = [';
const ARRAY_END   = '];\n\nlet currentFilter';

/* ── 내장 데이터 ── */
const ARTICLES = [
  { id:'c1', category:'insight', date:'2025년 6월 23일', readTime:'3분',
    title:'비행 데이터 분석, 항공 안전을 바꾸다',
    excerpt:'항공기에서 수집되는 방대한 비행 데이터(QAR)는 단순한 기록을 넘어, AI와 결합했을 때 항공 안전의 패러다임을 바꿀 수 있는 핵심 자원입니다.',
    body:`<p>항공기는 비행 중 수천 개의 파라미터를 초당 단위로 기록합니다. 이 데이터를 <strong>QAR(Quick Access Recorder)</strong>라고 부르며, 고도·속도·엔진 상태·조종 입력값 등 운항 전반에 걸친 정보가 담겨 있습니다.</p>
<h2>1. QAR 데이터란?</h2>
<p>QAR 데이터는 비행안전 분석의 핵심 자료입니다. 과거에는 사고 이후 원인 규명에 주로 사용됐지만, 최근에는 <strong>예방적 안전 관리</strong>를 위해 적극 활용되고 있습니다.</p>
<ul>
  <li><strong>수집 주기:</strong> 파라미터에 따라 1~8Hz</li>
  <li><strong>주요 파라미터:</strong> 고도, 속도, 피치/롤/요, 엔진 N1/N2, 연료 유량</li>
  <li><strong>활용 분야:</strong> FOQA(Flight Operational Quality Assurance)</li>
</ul>
<h2>2. AI와 결합하면 무엇이 달라지나?</h2>
<p>전통적인 분석은 사전에 정의된 임계값(threshold)을 초과할 때만 경보를 발생시킵니다. 반면 머신러닝 기반 접근은 <strong>정상 패턴을 학습</strong>하고, 그로부터 미세하게 벗어나는 구간을 스스로 탐지합니다.</p>
<blockquote>"Learning AI is more than writing code. It's about shaping how I see and change the world."</blockquote>
<h2>3. 앞으로의 방향</h2>
<p>비행 데이터 분석에 딥러닝과 이상 탐지 알고리즘을 결합하면, 사고가 발생하기 <strong>수십 회의 비행 전</strong>에 잠재적 위험 요소를 식별할 수 있습니다. 이는 항공 안전의 근본적인 패러다임 전환을 의미합니다.</p>`
  }
];

let currentFilter = 'all';

/* ════════════════════════════════════════════
   토큰 관리
════════════════════════════════════════════ */
function getToken()  { return localStorage.getItem(TOKEN_KEY) || ''; }
function saveToken() {
    const t = document.getElementById('tokenInput').value.trim();
    if (!t) { showToast('토큰을 입력해주세요.', true); return; }
    localStorage.setItem(TOKEN_KEY, t);
    closeTokenModal();
    updateTokenIndicator();
    showToast('✅ 토큰이 저장됐습니다.');
}
function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById('tokenInput').value = '';
    updateTokenIndicator();
    showToast('🗑 토큰이 삭제됐습니다.');
}
function updateTokenIndicator() {
    const btn = document.querySelector('.fab-token');
    btn.style.borderColor = getToken() ? '#10b981' : '#1e3a5f';
}

function openTokenModal() {
    document.getElementById('tokenInput').value = getToken();
    document.getElementById('tokenOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeTokenModal() {
    document.getElementById('tokenOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

/* ════════════════════════════════════════════
   GitHub API 헬퍼
════════════════════════════════════════════ */
async function ghGet(token) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}`,
        { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
    );
    if (!res.ok) throw new Error(`GitHub API 오류: ${res.status} — 토큰을 확인해주세요.`);
    return res.json();
}

async function ghPut(token, sha, newContent, message) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`,
        {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message,
                content: btoa(unescape(encodeURIComponent(newContent))),
                sha,
                branch: GH_BRANCH
            })
        }
    );
    if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || `GitHub 커밋 실패: ${res.status}`);
    }
    return res.json();
}

function injectArray(fileText, newArrayStr) {
    const s = fileText.indexOf(ARRAY_START);
    const e = fileText.indexOf(ARRAY_END);
    if (s === -1 || e === -1) throw new Error('ARTICLES 배열 위치를 찾을 수 없습니다.');
    return fileText.slice(0, s) + newArrayStr + '\n\n' + fileText.slice(e + 2);
}

function escStr(s) { return (s||'').replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$'); }

function serializeArticles(arr) {
    const esc = s => (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const items = arr.map(a =>
        `  { id:'${a.id}', category:'${a.category}', date:'${esc(a.date)}', readTime:'${esc(a.readTime)}',\n` +
        `    title:'${esc(a.title)}',\n` +
        `    excerpt:'${esc(a.excerpt)}',\n` +
        `    body:\`${escStr(a.body)}\` }`
    );
    return `const ARTICLES = [\n${items.join(',\n')}\n];`;
}

/* ════════════════════════════════════════════
   렌더
════════════════════════════════════════════ */
function renderCards(filter) {
    currentFilter = filter;
    const list = filter === 'all' ? ARTICLES : ARTICLES.filter(a => a.category === filter);
    document.getElementById('articlesGrid').innerHTML = list.length === 0
        ? `<p style="color:#64748b;text-align:center;padding:3rem;grid-column:1/-1;">아직 등록된 아티클이 없습니다.</p>`
        : list.map(a => {
            const catLabel = a.category === 'review' ? 'Paper Review' : 'Insight';
            return `
            <div class="article-card">
                <div class="card-body" onclick="showDetail('${a.id}')">
                    <div class="card-meta">
                        <span class="cat-badge cat-${a.category}">${catLabel}</span>
                        <span class="read-time">${a.readTime} 읽기</span>
                    </div>
                    <h3 class="card-title">${a.title}</h3>
                    <p class="card-excerpt">${a.excerpt}</p>
                </div>
                <div class="card-footer-bar">
                    <span class="card-read" onclick="showDetail('${a.id}')">View Details →</span>
                    <button class="delete-btn" onclick="deleteArticle('${a.id}',event)">Delete</button>
                </div>
            </div>`;
        }).join('');
}

function filterArticles(filter, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(filter);
}

/* ════════════════════════════════════════════
   디테일 뷰
════════════════════════════════════════════ */
function showDetail(id) {
    const a = ARTICLES.find(x => String(x.id) === String(id));
    if (!a) return;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    window.scrollTo(0, 0);
    const catLabel = a.category === 'review' ? 'Paper Review' : 'Insight';
    document.getElementById('detailContent').innerHTML = `
        <div style="margin-bottom:1.5rem;">
            <span class="cat-badge cat-${a.category}">${catLabel}</span>
        </div>
        <h1>${a.title}</h1>
        <div class="detail-meta">
            <span>호진 최</span>
            <span>${a.date}</span>
            <span>${a.readTime} 읽기</span>
        </div>
        ${a.body}`;
}

function backToList() {
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    window.scrollTo(0, 0);
}

/* ════════════════════════════════════════════
   글쓰기 모달
════════════════════════════════════════════ */
function openWrite() {
    if (!getToken()) {
        showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true);
        setTimeout(openTokenModal, 1000);
        return;
    }
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeWrite() {
    document.getElementById('writeOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

/* ── 등록 ── */
async function publishArticle() {
    const title   = document.getElementById('aTitle').value.trim();
    const excerpt = document.getElementById('aExcerpt').value.trim();
    const body    = document.getElementById('aBody').value.trim();
    if (!title || !excerpt || !body) { showToast('제목, 요약, 본문을 모두 입력해주세요.', true); return; }

    const token = getToken();
    if (!token) { showToast('GitHub Token이 없습니다. 🔑 버튼으로 설정해주세요.', true); return; }

    const btn = document.getElementById('publishBtn');
    btn.disabled = true;
    btn.textContent = '⏳ GitHub에 업로드 중...';

    try {
        const newItem = {
            id:       'c' + Date.now(),
            category: document.getElementById('aCategory').value,
            readTime: document.getElementById('aReadTime').value.trim() || '3분',
            date:     new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' }),
            title, excerpt, body
        };

        const { content: b64, sha } = await ghGet(token);
        const fileText = decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
        const newFile  = injectArray(fileText, serializeArticles([newItem, ...ARTICLES]));
        await ghPut(token, sha, newFile, `✍️ Add article: ${title}`);

        showToast('✅ GitHub에 등록됐습니다! 잠시 후 사이트가 업데이트됩니다.');
        closeWrite();
        ['aTitle','aExcerpt','aBody','aReadTime'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('aCategory').value = 'insight';
        setTimeout(() => location.reload(), 3000);

    } catch (err) {
        showToast('❌ ' + err.message, true);
    } finally {
        btn.disabled = false;
        btn.textContent = '📤 GitHub에 등록';
    }
}

/* ── 삭제 ── */
async function deleteArticle(id, e) {
    e.stopPropagation();
    if (!confirm('이 아티클을 삭제할까요?')) return;

    const token = getToken();
    if (!token) { showToast('GitHub Token이 없습니다. 🔑 버튼으로 설정해주세요.', true); return; }

    showToast('⏳ 삭제 중...');
    try {
        const { content: b64, sha } = await ghGet(token);
        const fileText   = decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
        const newArticles = ARTICLES.filter(a => String(a.id) !== String(id));
        const newFile    = injectArray(fileText, serializeArticles(newArticles));
        const deleted    = ARTICLES.find(a => String(a.id) === String(id));
        await ghPut(token, sha, newFile, `🗑 Delete article: ${deleted?.title || id}`);

        showToast('🗑 삭제됐습니다! 잠시 후 사이트가 업데이트됩니다.');
        setTimeout(() => location.reload(), 3000);
    } catch (err) {
        showToast('❌ ' + err.message, true);
    }
}

/* ════════════════════════════════════════════
   이벤트 & 토스트
════════════════════════════════════════════ */
['writeOverlay','tokenOverlay'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
        if (e.target === document.getElementById(id)) {
            if (id === 'writeOverlay') closeWrite();
            else closeTokenModal();
        }
    });
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeWrite(); closeTokenModal(); }
});

function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), isError ? 4000 : 2800);
}

/* ── 초기화 ── */
updateTokenIndicator();
renderCards('all');
</script>
</body>
</html>
