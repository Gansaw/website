  { id:1, category:'insight', date:'2025년 6월 23일', readTime:'3분',
    title:'양자컴퓨터, 새로운 컴퓨팅 시대를 여는 열쇠',
    excerpt:'최근 기술 업계에서 가장 많이 회자되는 키워드 중 하나는 단연 "양자컴퓨터(Quantum Computing)"입니다. 암호화·신약 개발·물질 설계·AI 등 다양한 분야를 혁신할 것으로 예상됩니다.',
    body:`<p>최근 기술 업계에서 가장 많이 회자되는 키워드 중 하나는 단연 <strong>"양자컴퓨터(Quantum Computing)"</strong>입니다. 이는 지금까지 우리가 접했던 컴퓨터 기술의 한계를 뛰어넘어 새로운 가능성을 제시하고 있으며, 암호화·신약 개발·물질 설계·AI 등 다양한 분야를 혁신할 것으로 예상됩니다.</p>
<p>특히 <strong>엔비디아 CEO 젠슨 황(Jensen Huang)</strong>은 최근 연설에서 양자컴퓨터를 "새 시대를 여는 문"이라고 언급하며, GPU와 양자컴퓨터가 함께 발전해 새로운 컴퓨팅 패러다임을 만들 것이라고 강조했습니다.</p>
<h2>1. 양자컴퓨터란 무엇일까?</h2>
<p>양자컴퓨터는 <strong>양자역학(Quantum Mechanics)</strong>의 원리를 통해 연산하는 컴퓨터로, 고전 컴퓨터와는 근본적으로 다른 원리로 작동합니다.</p>
<ul><li><strong>중첩(Superposition):</strong> 하나의 큐비트가 동시에 여러 상태를 나타냄</li><li><strong>얽힘(Entanglement):</strong> 여러 큐비트가 서로 강하게 연관되어 연산 속도·효율 증가</li><li><strong>양자 게이트(Quantum Gate):</strong> 큐비트 연산을 가능하게 하는 핵심 연산 장치</li></ul>
<h2>2. 젠슨 황의 비전: GPU + 양자컴퓨터</h2>
<p>앞으로는 GPU가 양자컴퓨터 연산과 연계되어 <strong>하이브리드 컴퓨팅(Hybrid Computing)</strong> 시대가 열릴 것으로 예상됩니다.</p>
<h2>3. 도입 시 직면하는 과제</h2>
<ul><li><strong>오류율(Error Rate):</strong> 외부 자극에 쉽게 영향을 받아 연산 정확도 저하</li><li><strong>냉각 기술:</strong> 절대영도(–273.15도) 근접 극저온 상태 유지 필요</li><li><strong>알고리즘 개발:</strong> 양자 소프트웨어 개발이 필수</li></ul>
<h2>4. 앞으로의 전망</h2>
<p>앞으로 <strong>5~10년 내</strong> 양자컴퓨터는 암호화·사이버 보안·의학·물질 개발뿐 아니라 경제·산업 전반에서 근본적인 패러다임 변화를 이끌 것입니다.</p>
<blockquote>"Learning AI is more than writing code. It's about shaping how I see and change the world."</blockquote>` },
  { id:2, category:'insight', date:'2025년 6월 9일', readTime:'3분',

  { id:3, category:'insight', date:'2025년 6월 9일', readTime:'3분',
    title:'LLM이 바꾸는 세상: 언어모델 그 이상의 의미',
    excerpt:'이 모든 변화의 중심에 있는 기술이 바로 대형 언어모델(LLM)입니다. LLM이 무엇인지, 어떻게 작동하며, 어떤 영향을 미치는지 살펴봅니다.',
    body:`<p>오늘날의 인공지능은 단순히 문장을 분류하거나 번역하는 수준을 넘어서, 문장을 <strong>창작하고, 추론하며, 대화를 이어가는 능력</strong>을 갖추게 되었습니다. 이 모든 변화의 중심에 있는 기술이 바로 <strong>대형 언어모델(LLM: Large Language Model)</strong>입니다.</p>
<h2>1. LLM이란?</h2>
<ul><li><strong>방대한 텍스트 학습:</strong> 위키백과, 뉴스 기사, 논문 등</li><li><strong>확률 기반 언어 생성:</strong> 문맥에서 가장 그럴듯한 단어 예측</li><li><strong>다중 기능 수행:</strong> 질문 답변, 요약, 번역, 코드 작성 등</li></ul>
<p>GPT, Claude, Gemini, LLaMA 등이 대표적인 LLM입니다.</p>
<h2>2. 작동 원리: Transformer</h2>
<p>LLM의 핵심은 2017년 Google의 <em>『Attention Is All You Need』</em>에서 제안된 <strong>Transformer</strong> 모델입니다.</p>
<h2>3. 활용 사례</h2>
<table><tr><th>분야</th><th>활용 예시</th></tr><tr><td>교육</td><td>AI 튜터, 에세이 피드백</td></tr><tr><td>법률</td><td>판례 요약, 법률 자문 보조</td></tr><tr><td>의료</td><td>진료 기록 정리, 논문 요약</td></tr><tr><td>프로그래밍</td><td>GitHub Copilot, Code Interpreter</td></tr></table>
<h2>4. 마치며</h2>

<blockquote>"Learning AI is more than writing code. It's about shaping how I see and change the world."</blockquote>` },

  { id:6, category:'review', date:'2025년 5월 19일', readTime:'2분',
    title:'[논문 리뷰] Attention Is All You Need',
    excerpt:'2017년 Google Brain 연구팀이 제안한 Transformer 아키텍처. 이 논문은 AI 분야의 패러다임을 바꾼 시발점으로 평가받습니다.',
    body:`<p>자연어 처리(NLP) 분야는 오랫동안 순차적 모델(RNN, LSTM 등)에 의존해왔습니다. 2017년, Google Brain 연구팀이 <strong>Transformer 아키텍처</strong>를 제안하며 AI 분야의 패러다임을 바꿨습니다.</p>
<h2>핵심 개념: Self-Attention</h2>
<ul><li><strong>병렬 처리 불가</strong> → 학습 속도 느림 (기존 RNN 문제)</li><li><strong>긴 거리 의존성 학습 한계</strong> → Transformer로 해결</li></ul>
<h2>아키텍처 구성 요소</h2>
<ol><li><strong>Scaled Dot-Product Attention:</strong> Query, Key, Value로 단어 간 중요도 계산</li><li><strong>Multi-Head Attention:</strong> 여러 Attention Head를 병렬 활용</li><li><strong>Position Encoding:</strong> 사인/코사인 함수로 위치 정보 표현</li></ol>
<h2>이후 영향</h2>
<ul><li><strong>BERT:</strong> 사전학습+파인튜닝 패러다임</li><li><strong>GPT:</strong> 언어 생성 모델 기준, GPT-4까지 발전</li><li><strong>ViT, T5, RoBERTa 등:</strong> 이미지, 음성, 멀티모달까지 확장</li></ul>
<h2>개인적인 인사이트</h2>
<p>Transformer의 가장 큰 가치는 <strong>"어떤 정보가 중요한지를 모델 스스로 판단할 수 있다"</strong>는 점에 있다.</p>
<blockquote>"Learning AI is more than writing code. It's about shaping how I see and change the world."</blockquote>` },

    title:'내가 AI를 공부하는 이유',
    excerpt:'저는 단순히 유행을 쫓기 위해 AI를 공부하는 것이 아닙니다. 2016년 이세돌과 알파고의 대국이 제 AI 공부의 출발점이었습니다.',
    body:`<p>저는 단순히 유행을 쫓기 위해 AI를 공부하는 것이 아닙니다. 처음 AI에 관심을 갖게 된 계기는 2016년, 이세돌 9단과 인공지능 알파고의 바둑 대국이었습니다.</p>
<p>이러한 계기로 2018년 육군 병장 만기 전역 후, <strong>기술데이터공학</strong>이라는 전공을 선택하게 되었습니다.</p>
<h2>1. 문제를 해결하는 도구, AI</h2>
<p>AI는 단순한 반복 작업을 자동화하고, 사람이 놓치기 쉬운 패턴을 학습하며, 미래를 예측하고 의사결정을 보조합니다.</p>
<h2>2. 데이터 속 숨은 의미를 발견하는 즐거움</h2>
<p>AI를 공부하다 보면 단순한 숫자들의 나열처럼 보이던 데이터가 전혀 다르게 보이기 시작합니다.</p>
<h2>3. 항공우주 산업에의 적용</h2>
<p>비행 데이터 분석, 이상 탐지, 예측 유지 보수 등 수많은 문제들이 AI를 통해 새로운 방식으로 접근될 수 있습니다.</p>
<h2>마무리하며</h2>
<p>AI를 공부한다는 것은 <strong>세상을 바라보는 새로운 관점을 갖게 하며, 나 자신을 끊임없이 성장시키는 여정</strong>입니다.</p>
<blockquote>"Learning AI is more than writing code. It's about shaping how I see and change the world."</blockquote>` }
];

let currentFilter = 'all';

/* ────────────────────────────────────────────
   스토리지 헬퍼
──────────────────────────────────────────── */
function loadCustom()  { try { return JSON.parse(localStorage.getItem('customArticles') || '[]'); } catch { return []; } }
function saveCustom(d) { localStorage.setItem('customArticles', JSON.stringify(d)); }
function allArticles() { return [...loadCustom(), ...ARTICLES]; }

/* ────────────────────────────────────────────
   렌더
──────────────────────────────────────────── */
function renderCards(filter) {
    currentFilter = filter;
    const list = filter === 'all' ? allArticles() : allArticles().filter(a => a.category === filter);
    document.getElementById('articlesGrid').innerHTML = list.map(a => {
        const custom = String(a.id).startsWith('c');
        const catLabel = a.category === 'review' ? 'Paper Review' : 'Insight';
        return `
        <div class="article-card">
            <div class="card-body" onclick="showDetail('${a.id}')">
                <div class="card-meta">
                    <span class="cat-badge cat-${a.category}">${catLabel}</span>
                    <span class="read-time">${a.readTime} 읽기</span>
                </div>
                <h3 class="card-title">${a.title}</h3>
                <p class="card-excerpt">${a.excerpt}</p>
            </div>
            <div class="card-footer-bar">
                <span class="card-date">${a.date}</span>
                <div class="card-actions">
                    ${custom ? `<button class="delete-btn" onclick="deleteArticle('${a.id}',event)">🗑 삭제</button>` : ''}
                    <span class="card-read" onclick="showDetail('${a.id}')">읽기 →</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

function filterArticles(filter, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(filter);
}

/* ────────────────────────────────────────────
   디테일 뷰
──────────────────────────────────────────── */
function showDetail(id) {
    const a = allArticles().find(x => String(x.id) === String(id));
    if (!a) return;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    window.scrollTo(0, 0);
    const catLabel = a.category === 'review' ? 'Paper Review' : 'Insight';
    document.getElementById('detailContent').innerHTML = `
        <div style="margin-bottom:1.5rem;">
            <span class="cat-badge cat-${a.category}">${catLabel}</span>
        </div>
        <h1>${a.title}</h1>
        <div class="detail-meta">
            <span>호진 최</span>
            <span>${a.date}</span>
            <span>${a.readTime} 읽기</span>
        </div>
        ${a.body}
    `;
}

function backToList() {
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    window.scrollTo(0, 0);
}

/* ────────────────────────────────────────────
   글쓰기 모달
──────────────────────────────────────────── */
function openWrite() {
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeWrite() {
    document.getElementById('writeOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

function publishArticle() {
    const title   = document.getElementById('aTitle').value.trim();
    const excerpt = document.getElementById('aExcerpt').value.trim();
    const body    = document.getElementById('aBody').value.trim();
    if (!title || !excerpt || !body) { showToast('제목, 요약, 본문을 모두 입력해주세요.', true); return; }

    const list = loadCustom();
    list.unshift({
        id:       'c' + Date.now(),
        title, excerpt, body,
        category: document.getElementById('aCategory').value,
        readTime: document.getElementById('aReadTime').value.trim() || '3분',
        date:     new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' })
    });
    saveCustom(list);

    ['aTitle','aExcerpt','aBody','aReadTime'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('aCategory').value = 'insight';
    closeWrite();
    renderCards(currentFilter);
    showToast('✅ 아티클이 등록되었습니다!');
}

/* 삭제 */
function deleteArticle(id, e) {
    e.stopPropagation();
    if (!confirm('이 아티클을 삭제할까요?')) return;
    saveCustom(loadCustom().filter(a => a.id !== id));
    renderCards(currentFilter);
    showToast('🗑 삭제되었습니다.');
}

/* ────────────────────────────────────────────
   이벤트 & 토스트
──────────────────────────────────────────── */
document.getElementById('writeOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('writeOverlay')) closeWrite();
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeWrite();
});

function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
}

/* ── 초기화 ── */
renderCards('all');
</script>
</body>
</html>
