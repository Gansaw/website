    /* ── Scroll Progress Bar ── */
    .scroll-progress {
        position: fixed; top: 0; left: 0; height: 3px; width: 0%;
        background: linear-gradient(90deg, #1e3a8a, var(--accent-color));
        z-index: 9999; transition: width 0.1s linear;
        border-radius: 0 2px 2px 0;
    }
    /* ── Table of Contents ── */
    .toc-box {
        background: var(--bg-secondary); border: 1px solid var(--border-color);
        border-radius: 12px; padding: 1.2rem 1.5rem; margin-bottom: 2rem;
    }
    .toc-box-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.08em; color: var(--accent-color); margin-bottom: 0.75rem; }
    .toc-list { list-style: none; margin: 0; padding: 0; }
    .toc-list li { margin: 0.3rem 0; }
    .toc-list a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; transition: color 0.2s ease; }
    .toc-list a:hover { color: var(--accent-color); }

    .post-nav-btn:hover { border-color: var(--accent-color); transform: translateY(-2px); }

    .post-nav-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase;

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
/* ── GitHub 설정 ── */
const GH_OWNER  = 'Gansaw';
const GH_REPO   = 'website';
const GH_FILE   = 'article.html';
const GH_BRANCH = 'main';
const TOKEN_KEY = 'gh_token_portfolio';

/* ── 데이터 마커 ── */
const DATA_START_MARKER = '<!--__ARTICLES_DATA_START__';
const DATA_END_MARKER   = '__ARTICLES_DATA_END__-->';

let ARTICLES = [];
let currentFilter = 'all';
let editingId = null;
let quillEditor = null;
let attachedFiles = [];

/* ════════════════════════════════════════════
   데이터 로드
════════════════════════════════════════════ */
function loadArticles() {
    try {
        const html = document.documentElement.outerHTML;
        const startIdx = html.indexOf(DATA_START_MARKER);
        const endIdx = html.indexOf(DATA_END_MARKER);
        
        if (startIdx !== -1 && endIdx !== -1) {
            const jsonStr = html.substring(startIdx + DATA_START_MARKER.length, endIdx).trim();
            ARTICLES = JSON.parse(jsonStr);
        }
    } catch (e) {
        console.error('데이터 로드 오류:', e);
        ARTICLES = [];
    }
}

/* ════════════════════════════════════════════
   Quill 에디터 초기화
════════════════════════════════════════════ */
function initQuillEditor() {
    if (!quillEditor) {
        quillEditor = new Quill('#aBodyEditor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline', 'strike'],
                    ['blockquote', 'code-block'],
                    [{ 'header': 1 }, { 'header': 2 }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'script': 'sub'}, { 'script': 'super' }],
                    [{ 'indent': '-1'}, { 'indent': '+1' }],
                    [{ 'size': ['small', false, 'large', 'huge'] }],
                    [{ 'font': [] }],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'align': [] }],
                    ['link'],
                    ['clean']
                ]
            },
            placeholder: '본문 내용을 입력하세요...'
        });
    }
}

/* ════════════════════════════════════════════
   파일 업로드 처리
════════════════════════════════════════════ */
function handleFileSelect(event) {
    const files = event.target.files;
    for (let file of files) {
        attachedFiles.push(file);
        renderFileList();
    }
}

function removeFile(index) {
    attachedFiles.splice(index, 1);
    renderFileList();
}

function renderFileList() {
    const fileList = document.getElementById('fileList');
    fileList.innerHTML = attachedFiles.map((file, idx) => `
        <div class="file-item">
            📄 ${file.name}
            <button type="button" onclick="removeFile(${idx})">✕</button>
        </div>
    `).join('');
}

/* ════════════════════════════════════════════
   토큰 관리
════════════════════════════════════════════ */
function getToken()  { return localStorage.getItem(TOKEN_KEY) || ''; }
function saveToken() {
    const t = document.getElementById('tokenInput').value.trim();
    if (!t) { showToast('토큰을 입력해주세요.', true); return; }
    localStorage.setItem(TOKEN_KEY, t);
    closeTokenModal();
    updateTokenIndicator();
    showToast('✅ 토큰이 저장됐습니다.');
}
function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById('tokenInput').value = '';
    updateTokenIndicator();
    showToast('🗑 토큰이 삭제됐습니다.');
}
function updateTokenIndicator() {
    document.querySelector('.fab-token').style.borderColor = getToken() ? '#10b981' : '#1e3a5f';
}
function openTokenModal() {
    document.getElementById('tokenInput').value = getToken();
    document.getElementById('tokenOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeTokenModal() {
    document.getElementById('tokenOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

/* ════════════════════════════════════════════
   GitHub API 헬퍼
════════════════════════════════════════════ */
async function ghGet(token) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`,
        { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
    );
    if (!res.ok) throw new Error(`GitHub API 오류: ${res.status} — 토큰을 확인해주세요.`);
    return res.json();
}
async function ghPut(token, sha, newContent, message) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`,
        {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(newContent))), sha, branch: GH_BRANCH })
        }
    );
    if (!res.ok) { const err = await res.json(); throw new Error(err.message || `GitHub 커밋 실패: ${res.status}`); }
    return res.json();
}

function injectJSON(fileText, newJSON) {
    const startIdx = fileText.indexOf(DATA_START_MARKER);
    const endIdx = fileText.indexOf(DATA_END_MARKER);
    if (startIdx === -1 || endIdx === -1) throw new Error('데이터 마커를 찾을 수 없습니다.');
    return fileText.slice(0, startIdx + DATA_START_MARKER.length) + '\n' + newJSON + '\n' + fileText.slice(endIdx);
}

/* ════════════════════════════════════════════
   시간 포맷팅
════════════════════════════════════════════ */
function getCurrentDateTime() {
    const now = new Date();
    const date = now.toLocaleDateString('ko-KR');
    const time = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    return { date, time };
}

/* ════════════════════════════════════════════
   렌더
════════════════════════════════════════════ */
function renderCards(filter) {
    currentFilter = filter;
    const list = filter === 'all' ? ARTICLES : ARTICLES.filter(a => a.category === filter);
    document.getElementById('articlesGrid').innerHTML = list.length === 0
        ? `<p style="color:#64748b;text-align:center;padding:3rem;grid-column:1/-1;">아직 등록된 아티클이 없습니다.</p>`
        : list.map(a => {
            const catLabel = a.category === 'review' ? 'Paper Review' : 'Insight';
            return `
            <div class="article-card">
                <div class="card-body" onclick="showDetail('${a.id}')">
                    <div class="card-meta">
                        <span class="cat-badge cat-${a.category}">${catLabel}</span>
                        <span class="card-date">${a.date} ${a.time}</span>
                    </div>
                    <h3 class="card-title">${a.title}</h3>
                    <p class="card-excerpt">${a.excerpt}</p>
                </div>
                <div class="card-footer-bar">
                    <span class="view-hint" onclick="showDetail('${a.id}')">View Details →</span>
                    <div class="card-actions">
                        <button class="edit-btn" onclick="editArticle('${a.id}'); event.stopPropagation();">Edit</button>
                        <button class="delete-btn" onclick="deleteArticle('${a.id}'); event.stopPropagation();">Delete</button>
                    </div>
                </div>
            </div>`;
        }).join('');
}

function showDetail(id) {
    const article = ARTICLES.find(a => a.id === id);
    if (!article) return;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    const meta = `<span>${article.date} ${article.time}</span>`;
    document.getElementById('detailContent').innerHTML = `
    <div class="detail-meta">${meta}</div>
    <h1>${article.title}</h1>
    <div class="modal-detail-content">${article.body}</div>`;
    setTimeout(() => {
        buildToC(document.getElementById('detailContent'), document.getElementById('tocBox'));
        buildPostNav(ARTICLES, id, document.getElementById('postNav'));
        initScrollProgress();
    }, 0);
}

function backToList() {
    document.getElementById('listView').style.display = 'block';
    document.getElementById('detailView').style.display = 'none';
}

/* ════════════════════════════════════════════
   글쓰기/수정
════════════════════════════════════════════ */
function openWrite() {
    if (!getToken()) {
        showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true);
        setTimeout(openTokenModal, 1000);
        return;
    }
    editingId = null;
    document.getElementById('writeModalTitle').textContent = '✍️ 새 아티클 작성';
    document.getElementById('aTitle').value = '';
    document.getElementById('aCategory').value = 'insight';
    document.getElementById('aExcerpt').value = '';
    attachedFiles = [];
    renderFileList();
    initQuillEditor();
    quillEditor.setContents([]);
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function editArticle(id) {
    if (!getToken()) {
        showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true);
        setTimeout(openTokenModal, 1000);
        return;
    }
    const article = ARTICLES.find(a => a.id === id);
    if (!article) return;
    editingId = id;
    document.getElementById('writeModalTitle').textContent = '✏️ 아티클 수정';
    document.getElementById('publishBtn').textContent = '💾 GitHub에 저장';
    document.getElementById('aTitle').value = article.title;
    document.getElementById('aCategory').value = article.category;
    document.getElementById('aExcerpt').value = article.excerpt;
    attachedFiles = [];
    renderFileList();
    initQuillEditor();
    quillEditor.root.innerHTML = article.body;
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeWrite() {
    document.getElementById('writeOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

async function publishArticle() {
    const title = document.getElementById('aTitle').value.trim();
    const category = document.getElementById('aCategory').value;
    const excerpt = document.getElementById('aExcerpt').value.trim();
    const body = quillEditor.root.innerHTML;

    if (!title || !excerpt || !body.replace(/<[^>]*>/g, '').trim()) {
        showToast('제목, 요약, 본문을 모두 입력해주세요.', true);
        return;
    }

    const token = getToken();
    if (!token) {
        showToast('GitHub 토큰을 설정해주세요.', true);
        openTokenModal();
        return;
    }

    try {
        const btn = document.getElementById('publishBtn');
        btn.disabled = true;
        btn.textContent = '⏳ GitHub에 업로드 중...';
        showToast('⏳ 처리 중...');
        const data = await ghGet(token);
        const fileText = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        const { date, time } = getCurrentDateTime();

        if (editingId) {
            const idx = ARTICLES.findIndex(a => a.id === editingId);
            if (idx !== -1) {
                ARTICLES[idx] = { ...ARTICLES[idx], title, category, excerpt, body, date, time };
            }
        } else {
            const newId = 'c' + Date.now();
            ARTICLES.unshift({ id: newId, category, date, time, title, excerpt, body });
        }

        const newJSON = JSON.stringify(ARTICLES);
        const newContent = injectJSON(fileText, newJSON);
        const msg = editingId ? `✏️ Edit article: ${title}` : `✍️ Add article: ${title}`;
        await ghPut(token, data.sha, newContent, msg);

        closeWrite();
        showToast('✅ GitHub에 등록되었습니다! 잠시 후 사이트가 업데이트됩니다.');
        setTimeout(() => location.reload(), 2000);
    } catch (err) {
        showToast(`❌ 오류: ${err.message}`, true);
        const btn = document.getElementById('publishBtn');
        btn.disabled = false;
        btn.textContent = editingId ? '💾 GitHub에 저장' : '📤 GitHub에 등록';
    }
}

function deleteArticle(id) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    const token = getToken();
    if (!token) { showToast('GitHub Token이 없습니다. 🔑 버튼으로 설정해주세요.', true); return; }
    showToast('⏳ 삭제 중...');
    const idx = ARTICLES.findIndex(a => a.id === id);
    if (idx === -1) return;
    const removed = ARTICLES[idx];
    ghGet(token).then(data => {
        const fileText = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        ARTICLES.splice(idx, 1);
        const newJSON = JSON.stringify(ARTICLES);
        const newContent = injectJSON(fileText, newJSON);
        return ghPut(token, data.sha, newContent, `🗑 Delete article: ${removed.title}`);
    }).then(() => {
        renderCards(currentFilter);
        showToast(`🗑 삭제됐습니다! 잠시 후 사이트가 업데이트됩니다.`);
        setTimeout(() => location.reload(), 3000);
    }).catch(err => {
        showToast('❌ ' + err.message, true);
    });
}

/* ════════════════════════════════════════════
   필터 & 토스트
════════════════════════════════════════════ */
function filterArticles(cat, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(cat);
}

function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.toggle('error', isError);
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}


/* ── Scroll Progress ── */
function initScrollProgress() {
    const bar = document.getElementById('scrollProgressBar');
    if (!bar) return;
    window.addEventListener('scroll', () => {
        const total = document.documentElement.scrollHeight - window.innerHeight;
        bar.style.width = (total > 0 ? (window.scrollY / total) * 100 : 0) + '%';
    }, { passive: true });
}

/* ── ToC ── */
function buildToC(contentEl, tocEl) {
    const headings = contentEl.querySelectorAll('h2, h3');
    tocEl.style.display = 'none';
    if (headings.length < 2) return;
    const wrap = tocEl.querySelector('.toc-list-wrap');
    wrap.innerHTML = '';
    const ul = document.createElement('ul');
    ul.className = 'toc-list';
    headings.forEach((h, i) => {
        if (!h.id) h.id = 'hdg-' + i;
        const li = document.createElement('li');
        if (h.tagName === 'H3') li.className = 'toc-h3';
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        a.addEventListener('click', e => { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        li.appendChild(a);
        ul.appendChild(li);
    });
    wrap.appendChild(ul);
    tocEl.style.display = 'block';
}

/* ── Prev / Next ── */
function buildPostNav(items, currentId, navEl) {
    const idx = items.findIndex(x => x.id === currentId);
    const prev = items[idx + 1];
    const next = items[idx - 1];
    let h = '';
    if (prev) h += `<button class="post-nav-btn" onclick="showDetail('${prev.id}')"><div class="post-nav-label">← Previous</div><div class="post-nav-title">${prev.title}</div></button>`;
    else h += '<div></div>';
    if (next) h += `<button class="post-nav-btn next" onclick="showDetail('${next.id}')"><div class="post-nav-label">Next →</div><div class="post-nav-title">${next.title}</div></button>`;
    navEl.innerHTML = h;
}

/* ════════════════════════════════════════════
   초기화
════════════════════════════════════════════ */
loadArticles();
renderCards('all');
updateTokenIndicator();
</script>
