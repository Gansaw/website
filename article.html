<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | HoJin Choi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 리스트 뷰 -->
<div id="listView" style="padding-top:0;">
    <div class="page-hero">
        <h1>Article</h1>
        <p>AI · 데이터 분석 · 항공우주 산업 인사이트와 논문 리뷰</p>
    </div>
    <div style="display:flex; justify-content:center; padding:0.75rem 1rem 0;">
        <a href="index.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">← Back to Home</a>
    </div>
    <div class="filters">
        <button class="filter-btn active" onclick="filterArticles('all',this)">All</button>
        <button class="filter-btn" onclick="filterArticles('insight',this)">Insight</button>
        <button class="filter-btn" onclick="filterArticles('review',this)">Paper Review</button>
    </div>
    <div class="articles-grid" id="articlesGrid"></div>
</div>

<!-- 디테일 뷰 -->
<div id="detailView">
    <button class="back-btn" onclick="backToList()">← 목록으로</button>
    <div id="detailContent"></div>
</div>

<!-- 글쓰기/수정 모달 -->
<div class="write-overlay" id="writeOverlay">
    <div class="write-modal">
        <div class="write-modal-header">
            <h2 id="writeModalTitle">✍️ 새 아티클 작성</h2>
            <button class="write-modal-close" onclick="closeWrite()">&#10005;</button>
        </div>

        <label class="wm-label">제목 *</label>
        <input id="aTitle" type="text" class="wm-input" placeholder="e.g. LLM이 바꾸는 세상">

        <div class="wm-row">
            <div>
                <label class="wm-label">카테고리</label>
                <select id="aCategory" class="wm-select">
                    <option value="insight">Insight</option>
                    <option value="review">Paper Review</option>
                </select>
            </div>
        </div>

        <label class="wm-label">요약 (카드 미리보기) *</label>
        <textarea id="aExcerpt" class="wm-textarea" rows="3" placeholder="카드에 표시될 짧은 요약 (2~3줄)..."></textarea>

        <!-- Quill 에디터 -->
        <label class="wm-label">본문 * <span style="font-weight:400; color:#475569; text-transform:none; letter-spacing:0;">(시각적 편집)</span></label>
        <div class="editor-container">
            <div id="aBodyEditor" style="background:#1e293b; border-radius:8px;"></div>
        </div>

        <!-- 첨부파일 -->
        <div class="file-upload-section">
            <label class="file-upload-label">첨부파일 (선택)</label>
            <button type="button" class="file-upload-btn" onclick="document.getElementById('fileInput').click()">
                📎 파일 선택 또는 드래그 앤 드롭
            </button>
            <input id="fileInput" type="file" class="file-upload-input" multiple onchange="handleFileSelect(event)">
            <div class="file-list" id="fileList"></div>
        </div>

        <button class="wm-submit" id="publishBtn" onclick="publishArticle()">📤 GitHub에 등록</button>
    </div>
</div>

<!-- 토큰 설정 모달 -->
<div class="write-overlay" id="tokenOverlay">
    <div class="write-modal" style="max-width:480px;">
        <div class="write-modal-header">
            <h2>🔑 GitHub Token 설정</h2>
            <button class="write-modal-close" onclick="closeTokenModal()">&#10005;</button>
        </div>
        <p style="font-size:0.9rem; color:#94a3b8; margin-bottom:1.5rem; line-height:1.6;">
            GitHub에 글을 발행하려면 Personal Access Token이 필요합니다.<br>
            토큰은 이 브라우저에만 저장되며 외부로 전송되지 않습니다.
        </p>
        <label class="wm-label">Personal Access Token
            <a href="https://github.com/settings/tokens/new?scopes=repo&description=portfolio-write"
               target="_blank"
               style="font-weight:400; color:#60a5fa; text-transform:none; letter-spacing:0; margin-left:0.5rem;">
               발급하러 가기 →
            </a>
        </label>
        <input id="tokenInput" type="password" class="wm-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        <p class="wm-hint">repo 권한 체크 후 발급 · 페이지를 닫아도 유지됩니다</p>
        <button class="wm-submit" onclick="saveToken()">💾 저장</button>
        <button onclick="clearToken()" style="width:100%; margin-top:0.6rem; padding:0.6rem; background:transparent; border:1px solid #334155; border-radius:8px; color:#64748b; font-family:inherit; font-size:0.85rem; cursor:pointer;">
            저장된 토큰 삭제
        </button>
    </div>
</div>

<!-- FAB 그룹 -->
<div class="fab-group">
    <button class="fab fab-token" onclick="openTokenModal()" title="GitHub Token 설정">🔑</button>
    <button class="fab fab-write" onclick="openWrite()" title="새 아티클 작성">✍️</button>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<!-- 데이터 저장 영역 (HTML 주석 내 JSON) -->
<!--__ARTICLES_DATA_START__
[{"id":"c1","category":"insight","date":"2026. 3. 3.","time":"오전 03:58","title":"비행 데이터 분석, 항공 안전을 바꾸다","excerpt":"항공기에서 수집되는 방대한 비행 데이터(QAR)는 단순한 기록을 넘어, AI와 결합했을 때 항공 안전의 패러다임을 바꿀 수 있는 핵심 자원입니다.","body":"<p>항공기는 비행 중 수천 개의 파라미터를 초당 단위로 기록합니다. 이 데이터를 <strong>QAR(Quick Access Recorder)</strong>라고 부르며, 고도·속도·엔진 상태·조종 입력값 등 운항 전반에 걸친 정보가 담겨 있습니다.</p><p><br></p><h2>1. QAR 데이터란?</h2><p><br></p><p>QAR 데이터는 비행안전 분석의 핵심 자료입니다. 과거에는 사고 이후 원인 규명에 주로 사용됐지만, 최근에는 <strong>예방적 안전 관리</strong>를 위해 적극 활용되고 있습니다.</p><p><br></p><p><br></p><p><br></p><h2>2. AI와 결합하면 무엇이 달라지나?</h2><p><br></p><p>전통적인 분석은 사전에 정의된 임계값(threshold)을 초과할 때만 경보를 발생시킵니다. 반면 머신러닝 기반 접근은 <strong>정상 패턴을 학습</strong>하고, 그로부터 미세하게 벗어나는 구간을 스스로 탐지합니다.</p><p><br></p><blockquote>Learning AI is more than writing code. It's about shaping how I see and change the world.</blockquote><p><br></p><h2>3. 앞으로의 방향</h2><p><br></p><p>비행 데이터 분석에 딥러닝과 이상 탐지 알고리즘을 결합하면, 사고가 발생하기 <strong>수십 회의 비행 전</strong>에 잠재적 위험 요소를 식별할 수 있습니다. 이는 항공 안전의 근본적인 패러다임 전환을 의미합니다.</p>"}]
__ARTICLES_DATA_END__-->

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
/* ── GitHub 설정 ── */
const GH_OWNER  = 'Gansaw';
const GH_REPO   = 'website';
const GH_FILE   = 'article.html';
const GH_BRANCH = 'main';
const TOKEN_KEY = 'gh_token_portfolio';

/* ── 데이터 마커 ── */
const DATA_START_MARKER = '<!--__ARTICLES_DATA_START__';
const DATA_END_MARKER   = '__ARTICLES_DATA_END__-->';

let ARTICLES = [];
let currentFilter = 'all';
let editingId = null;
let quillEditor = null;
let attachedFiles = [];

/* ════════════════════════════════════════════
   데이터 로드
════════════════════════════════════════════ */
function loadArticles() {
    try {
        const html = document.documentElement.outerHTML;
        const startIdx = html.indexOf(DATA_START_MARKER);
        const endIdx = html.indexOf(DATA_END_MARKER);
        
        if (startIdx !== -1 && endIdx !== -1) {
            const jsonStr = html.substring(startIdx + DATA_START_MARKER.length, endIdx).trim();
            ARTICLES = JSON.parse(jsonStr);
        }
    } catch (e) {
        console.error('데이터 로드 오류:', e);
        ARTICLES = [];
    }
}

/* ════════════════════════════════════════════
   Quill 에디터 초기화
════════════════════════════════════════════ */
function initQuillEditor() {
    if (!quillEditor) {
        quillEditor = new Quill('#aBodyEditor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline', 'strike'],
                    ['blockquote', 'code-block'],
                    [{ 'header': 1 }, { 'header': 2 }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'script': 'sub'}, { 'script': 'super' }],
                    [{ 'indent': '-1'}, { 'indent': '+1' }],
                    [{ 'size': ['small', false, 'large', 'huge'] }],
                    [{ 'font': [] }],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'align': [] }],
                    ['link'],
                    ['clean']
                ]
            },
            placeholder: '본문 내용을 입력하세요...'
        });
    }
}

/* ════════════════════════════════════════════
   파일 업로드 처리
════════════════════════════════════════════ */
function handleFileSelect(event) {
    const files = event.target.files;
    for (let file of files) {
        attachedFiles.push(file);
        renderFileList();
    }
}

function removeFile(index) {
    attachedFiles.splice(index, 1);
    renderFileList();
}

function renderFileList() {
    const fileList = document.getElementById('fileList');
    fileList.innerHTML = attachedFiles.map((file, idx) => `
        <div class="file-item">
            📄 ${file.name}
            <button type="button" onclick="removeFile(${idx})">✕</button>
        </div>
    `).join('');
}

/* ════════════════════════════════════════════
   토큰 관리
════════════════════════════════════════════ */
function getToken()  { return localStorage.getItem(TOKEN_KEY) || ''; }
function saveToken() {
    const t = document.getElementById('tokenInput').value.trim();
    if (!t) { showToast('토큰을 입력해주세요.', true); return; }
    localStorage.setItem(TOKEN_KEY, t);
    closeTokenModal();
    updateTokenIndicator();
    showToast('✅ 토큰이 저장됐습니다.');
}
function clearToken() {
    localStorage.removeItem(TOKEN_KEY);
    document.getElementById('tokenInput').value = '';
    updateTokenIndicator();
    showToast('🗑 토큰이 삭제됐습니다.');
}
function updateTokenIndicator() {
    document.querySelector('.fab-token').style.borderColor = getToken() ? '#10b981' : '#1e3a5f';
}
function openTokenModal() {
    document.getElementById('tokenInput').value = getToken();
    document.getElementById('tokenOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeTokenModal() {
    document.getElementById('tokenOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

/* ════════════════════════════════════════════
   GitHub API 헬퍼
════════════════════════════════════════════ */
async function ghGet(token) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`,
        { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
    );
    if (!res.ok) throw new Error(`GitHub API 오류: ${res.status} — 토큰을 확인해주세요.`);
    return res.json();
}
async function ghPut(token, sha, newContent, message) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`,
        {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(newContent))), sha, branch: GH_BRANCH })
        }
    );
    if (!res.ok) { const err = await res.json(); throw new Error(err.message || `GitHub 커밋 실패: ${res.status}`); }
    return res.json();
}

function injectJSON(fileText, newJSON) {
    const startIdx = fileText.indexOf(DATA_START_MARKER);
    const endIdx = fileText.indexOf(DATA_END_MARKER);
    if (startIdx === -1 || endIdx === -1) throw new Error('데이터 마커를 찾을 수 없습니다.');
    return fileText.slice(0, startIdx + DATA_START_MARKER.length) + '\n' + newJSON + '\n' + fileText.slice(endIdx);
}

/* ════════════════════════════════════════════
   시간 포맷팅
════════════════════════════════════════════ */
function getCurrentDateTime() {
    const now = new Date();
    const date = now.toLocaleDateString('ko-KR');
    const time = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    return { date, time };
}

/* ════════════════════════════════════════════
   렌더
════════════════════════════════════════════ */
function renderCards(filter) {
    currentFilter = filter;
    const list = filter === 'all' ? ARTICLES : ARTICLES.filter(a => a.category === filter);
    document.getElementById('articlesGrid').innerHTML = list.length === 0
        ? `<p style="color:#64748b;text-align:center;padding:3rem;grid-column:1/-1;">아직 등록된 아티클이 없습니다.</p>`
        : list.map(a => {
            const catLabel = a.category === 'review' ? 'Paper Review' : 'Insight';
            return `
            <div class="article-card">
                <div class="card-body" onclick="showDetail('${a.id}')">
                    <div class="card-meta">
                        <span class="cat-badge cat-${a.category}">${catLabel}</span>
                        <span class="card-date">${a.date} ${a.time}</span>
                    </div>
                    <h3 class="card-title">${a.title}</h3>
                    <p class="card-excerpt">${a.excerpt}</p>
                </div>
                <div class="card-footer-bar">
                    <span class="view-hint" onclick="showDetail('${a.id}')">View Details →</span>
                    <div class="card-actions">
                        <button class="edit-btn" onclick="editArticle('${a.id}'); event.stopPropagation();">Edit</button>
                        <button class="delete-btn" onclick="deleteArticle('${a.id}'); event.stopPropagation();">Delete</button>
                    </div>
                </div>
            </div>`;
        }).join('');
}

function showDetail(id) {
    const article = ARTICLES.find(a => a.id === id);
    if (!article) return;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    const meta = `<span>${article.date} ${article.time}</span>`;
    document.getElementById('detailContent').innerHTML = `
        <div class="detail-meta">${meta}</div>
        <h1>${article.title}</h1>
        ${article.body}`;
}

function backToList() {
    document.getElementById('listView').style.display = 'block';
    document.getElementById('detailView').style.display = 'none';
}

/* ════════════════════════════════════════════
   글쓰기/수정
════════════════════════════════════════════ */
function openWrite() {
    if (!getToken()) {
        showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true);
        setTimeout(openTokenModal, 1000);
        return;
    }
    editingId = null;
    document.getElementById('writeModalTitle').textContent = '✍️ 새 아티클 작성';
    document.getElementById('aTitle').value = '';
    document.getElementById('aCategory').value = 'insight';
    document.getElementById('aExcerpt').value = '';
    attachedFiles = [];
    renderFileList();
    initQuillEditor();
    quillEditor.setContents([]);
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function editArticle(id) {
    if (!getToken()) {
        showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true);
        setTimeout(openTokenModal, 1000);
        return;
    }
    const article = ARTICLES.find(a => a.id === id);
    if (!article) return;
    editingId = id;
    document.getElementById('writeModalTitle').textContent = '✏️ 아티클 수정';
    document.getElementById('publishBtn').textContent = '💾 GitHub에 저장';
    document.getElementById('aTitle').value = article.title;
    document.getElementById('aCategory').value = article.category;
    document.getElementById('aExcerpt').value = article.excerpt;
    attachedFiles = [];
    renderFileList();
    initQuillEditor();
    quillEditor.root.innerHTML = article.body;
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeWrite() {
    document.getElementById('writeOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

async function publishArticle() {
    const title = document.getElementById('aTitle').value.trim();
    const category = document.getElementById('aCategory').value;
    const excerpt = document.getElementById('aExcerpt').value.trim();
    const body = quillEditor.root.innerHTML;

    if (!title || !excerpt || !body.replace(/<[^>]*>/g, '').trim()) {
        showToast('제목, 요약, 본문을 모두 입력해주세요.', true);
        return;
    }

    const token = getToken();
    if (!token) {
        showToast('GitHub 토큰을 설정해주세요.', true);
        openTokenModal();
        return;
    }

    try {
        const btn = document.getElementById('publishBtn');
        btn.disabled = true;
        btn.textContent = '⏳ GitHub에 업로드 중...';
        showToast('⏳ 처리 중...');
        const data = await ghGet(token);
        const fileText = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        const { date, time } = getCurrentDateTime();

        if (editingId) {
            const idx = ARTICLES.findIndex(a => a.id === editingId);
            if (idx !== -1) {
                ARTICLES[idx] = { ...ARTICLES[idx], title, category, excerpt, body, date, time };
            }
        } else {
            const newId = 'c' + Date.now();
            ARTICLES.unshift({ id: newId, category, date, time, title, excerpt, body });
        }

        const newJSON = JSON.stringify(ARTICLES);
        const newContent = injectJSON(fileText, newJSON);
        const msg = editingId ? `Update article: ${title}` : `Add article: ${title}`;
        await ghPut(token, data.sha, newContent, msg);

        closeWrite();
        showToast('✅ GitHub에 등록되었습니다! 잠시 후 사이트가 업데이트됩니다.');
        setTimeout(() => location.reload(), 2000);
    } catch (err) {
        showToast(`❌ 오류: ${err.message}`, true);
        const btn = document.getElementById('publishBtn');
        btn.disabled = false;
        btn.textContent = editingId ? '💾 GitHub에 저장' : '📤 GitHub에 등록';
    }
}

function deleteArticle(id) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    const token = getToken();
    if (!token) { showToast('GitHub Token이 없습니다. 🔑 버튼으로 설정해주세요.', true); return; }
    showToast('⏳ 삭제 중...');
    const idx = ARTICLES.findIndex(a => a.id === id);
    if (idx === -1) return;
    const removed = ARTICLES[idx];
    ghGet(token).then(data => {
        const fileText = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        ARTICLES.splice(idx, 1);
        const newJSON = JSON.stringify(ARTICLES);
        const newContent = injectJSON(fileText, newJSON);
        return ghPut(token, data.sha, newContent, `🗑 Delete article: ${removed.title}`);
    }).then(() => {
        renderCards(currentFilter);
        showToast(`🗑 삭제됐습니다! 잠시 후 사이트가 업데이트됩니다.`);
        setTimeout(() => location.reload(), 3000);
    }).catch(err => {
        showToast('❌ ' + err.message, true);
    });
}

/* ════════════════════════════════════════════
   필터 & 토스트
════════════════════════════════════════════ */
function filterArticles(cat, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(cat);
}

function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.toggle('error', isError);
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

/* ════════════════════════════════════════════
   초기화
════════════════════════════════════════════ */
loadArticles();
renderCards('all');
updateTokenIndicator();
</script>
</body>
</html>
