## 왜 지금 강화학습인가?

기존 항공 경로 최적화는 대부분 **규칙 기반(rule-based)** 또는 **선형 계획법(LP)** 방식에 의존해왔다.
이 방법들은 환경이 정적일 때는 잘 작동하지만, 실시간으로 변하는 기상·공역·트래픽 조건에 대응하기 어렵다.

반면 **강화학습(Reinforcement Learning, RL)** 은 다음과 같은 방식으로 동작한다.

환경(Environment) ↔ 에이전트(Agent) 상태(State) → 행동(Action) → 보상(Reward) → 새로운 상태


에이전트는 시뮬레이션 환경 안에서 수천 번의 비행을 경험하며, 연료를 아끼면서도
지연 없이 목적지에 도달하는 **최적 정책(Policy)** 을 스스로 발견한다.

---

## 항공 경로 최적화 문제를 MDP로 정의하면?

강화학습 문제는 **마르코프 결정 과정(MDP)** 으로 정형화된다.
항공 경로 문제에 적용하면 다음과 같이 설계할 수 있다.

| 요소 | 항공 문제에서의 정의 |
|------|---------------------|
| **State** | 현재 위치(위·경도·고도), 기상 조건, 연료량, 남은 거리 |
| **Action** | 헤딩 변경, 고도 조정, 속도 조정 |
| **Reward** | 연료 소모 최소화 + 도착 지연 패널티 + 안전 제약 위반 패널티 |
| **Terminal** | 목적지 도착 또는 비행 불가 상태 |

---

## 실제 적용 사례: 어디까지 왔나?

### ① NASA / OpenAI 계열 연구
여러 연구 그룹에서 **Proximal Policy Optimization(PPO)**, **Soft Actor-Critic(SAC)** 등의
알고리즘을 활용해 항공 경로 최적화를 시도하고 있다.
특히 **연료 절감 측면에서 기존 최적화 대비 3~8% 개선** 결과가 다수 보고되고 있다.

### ② Airbus · Boeing 내부 연구
대형 항공기 제조사들도 RL 기반의 자율 비행 경로 보조 시스템을 연구 중이다.
완전 자율화보다는 **인간 조종사를 보조하는 Co-pilot AI** 형태로 현실화될 가능성이 높다.

### ③ 항공 관제(ATC) 연구
공역 혼잡도를 줄이기 위한 **Multi-Agent RL(MARL)** 적용 연구도 활발하다.
여러 항공기가 동시에 에이전트로 동작하며 충돌 회피와 지연 최소화를 동시에 달성한다.

---

## 핵심 과제: 왜 아직 현장에 없을까?

강화학습의 항공 적용이 매력적임에도 실용화가 느린 이유가 있다.

1. **안전 인증 문제** — 항공 소프트웨어는 DO-178C 등 엄격한 인증이 필요하다.
   블랙박스 성격의 신경망은 이 기준을 충족하기 어렵다.

2. **시뮬레이션-현실 갭 (Sim-to-Real Gap)** — 훈련 환경과 실제 비행 환경의 차이가 크다.
   현실의 기상, 관제 지시, 비상 상황을 완전히 모사하는 시뮬레이터 구축이 과제다.

3. **희소 보상 문제 (Sparse Reward)** — 장거리 비행에서는 에이전트가 보상 신호를 받기까지
   너무 오랜 시간이 걸려 학습이 수렴하지 못하는 경우가 많다.

async function ghGet(token) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}`,
        { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
    );
    if (!res.ok) throw new Error(`GitHub API 오류: ${res.status} — 토큰을 확인해주세요.`);
    return res.json();
}
async function ghPut(token, sha, newContent, message) {
    const res = await fetch(
        `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`,
        {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(newContent))), sha, branch: GH_BRANCH })
        }
    );
    if (!res.ok) { const err = await res.json(); throw new Error(err.message || `GitHub 커밋 실패: ${res.status}`); }
    return res.json();
}
function injectArray(fileText, newArrayStr) {
    const s = fileText.indexOf(ARRAY_START);
    const e = fileText.indexOf(ARRAY_END);
    if (s === -1 || e === -1) throw new Error('ARTICLES 배열 위치를 찾을 수 없습니다.');
    return fileText.slice(0, s) + newArrayStr + '\n\n' + fileText.slice(e + 2);
}
function escStr(s) { return (s||'').replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$'); }
function serializeArticles(arr) {
    const esc = s => (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const items = arr.map(a =>
        `  { id:'${a.id}', category:'${a.category}', date:'${esc(a.date)}', readTime:'${esc(a.readTime)}',\n` +
        `    title:'${esc(a.title)}',\n` +
        `    excerpt:'${esc(a.excerpt)}',\n` +
        `    body:\`${escStr(a.body)}\` }`
    );
    return `const ARTICLES = [\n${items.join(',\n')}\n];`;
}

        </div>
        <h1>${a.title}</h1>
        <div class="detail-meta">
            <span>호진 최</span>
            <span>${a.date}</span>
            <span>${a.readTime} 읽기</span>
        </div>
        ${a.body}`;
}
function backToList() {
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    window.scrollTo(0, 0);
}

/* ════════════════════════════════════════════
   글쓰기 / 수정 모달
════════════════════════════════════════════ */
function openWrite() {
    if (!getToken()) {
        showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true);
        setTimeout(openTokenModal, 1000);
        return;
    }
    // 신규 작성 모드
    editingId = null;
    document.getElementById('writeModalTitle').textContent = '✍️ 새 아티클 작성';
    document.getElementById('publishBtn').textContent = '📤 GitHub에 등록';
    ['aTitle','aExcerpt','aBody','aReadTime'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('aCategory').value = 'insight';
    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function openEdit(id, e) {
    e.stopPropagation();
    if (!getToken()) {
        showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true);
        setTimeout(openTokenModal, 1000);
        return;
    }
    const a = ARTICLES.find(x => String(x.id) === String(id));
    if (!a) return;

    // 수정 모드 — 기존 데이터로 폼 채우기
    editingId = a.id;
    document.getElementById('writeModalTitle').textContent = '✏️ 아티클 수정';
    document.getElementById('publishBtn').textContent = '💾 GitHub에 저장';
    document.getElementById('aTitle').value    = a.title;
    document.getElementById('aCategory').value = a.category;
    document.getElementById('aReadTime').value = a.readTime;
    document.getElementById('aExcerpt').value  = a.excerpt;
    document.getElementById('aBody').value     = a.body;

    document.getElementById('writeOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeWrite() {
    document.getElementById('writeOverlay').classList.remove('active');
    document.body.style.overflow = '';
    editingId = null;
}

/* ── 등록 / 저장 ── */
async function publishArticle() {
    const title   = document.getElementById('aTitle').value.trim();
    const excerpt = document.getElementById('aExcerpt').value.trim();
    const body    = document.getElementById('aBody').value.trim();
    if (!title || !excerpt || !body) { showToast('제목, 요약, 본문을 모두 입력해주세요.', true); return; }

    const token = getToken();
    if (!token) { showToast('GitHub Token이 없습니다. 🔑 버튼으로 설정해주세요.', true); return; }

    const btn = document.getElementById('publishBtn');
    btn.disabled = true;
    btn.textContent = '⏳ GitHub에 업로드 중...';

    try {
        const existing = editingId ? ARTICLES.find(a => String(a.id) === String(editingId)) : null;
        const item = {
            id:       editingId || ('c' + Date.now()),
            category: document.getElementById('aCategory').value,
            readTime: document.getElementById('aReadTime').value.trim() || '3분',
            date:     existing ? existing.date : new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' }),
            title, excerpt, body
        };

        const { content: b64, sha } = await ghGet(token);
        const fileText = decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));

        let newArticles, commitMsg;
        if (editingId) {
            newArticles = ARTICLES.map(a => String(a.id) === String(editingId) ? item : a);
            commitMsg = `✏️ Edit article: ${title}`;
        } else {
            newArticles = [item, ...ARTICLES];
            commitMsg = `✍️ Add article: ${title}`;
        }

        const newFile = injectArray(fileText, serializeArticles(newArticles));
        await ghPut(token, sha, newFile, commitMsg);

        showToast(editingId ? '✅ 수정됐습니다! 잠시 후 사이트가 업데이트됩니다.' : '✅ GitHub에 등록됐습니다! 잠시 후 사이트가 업데이트됩니다.');
        closeWrite();
        setTimeout(() => location.reload(), 3000);

    } catch (err) {
        showToast('❌ ' + err.message, true);
    } finally {
        btn.disabled = false;
        btn.textContent = editingId ? '💾 GitHub에 저장' : '📤 GitHub에 등록';
    }
}

/* ── 삭제 ── */
async function deleteArticle(id, e) {
    e.stopPropagation();
    if (!confirm('이 아티클을 삭제할까요?')) return;
    const token = getToken();
    if (!token) { showToast('GitHub Token이 없습니다. 🔑 버튼으로 설정해주세요.', true); return; }
    showToast('⏳ 삭제 중...');
    try {
        const { content: b64, sha } = await ghGet(token);
        const fileText   = decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
        const newArticles = ARTICLES.filter(a => String(a.id) !== String(id));
        const newFile    = injectArray(fileText, serializeArticles(newArticles));
        const deleted    = ARTICLES.find(a => String(a.id) === String(id));
        await ghPut(token, sha, newFile, `🗑 Delete article: ${deleted?.title || id}`);
        showToast('🗑 삭제됐습니다! 잠시 후 사이트가 업데이트됩니다.');
        setTimeout(() => location.reload(), 3000);
    } catch (err) {
        showToast('❌ ' + err.message, true);
    }
}

/* ════════════════════════════════════════════
   이벤트 & 토스트
════════════════════════════════════════════ */
['writeOverlay','tokenOverlay'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
        if (e.target === document.getElementById(id)) {
            if (id === 'writeOverlay') closeWrite();
            else closeTokenModal();
        }
    });
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeWrite(); closeTokenModal(); }
});
function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), isError ? 4000 : 2800);
}

updateTokenIndicator();
renderCards('all');
</script>
