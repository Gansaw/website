<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal | HoJin Choi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Goal 전용 스타일 */
        .goal-month-header {            
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-color);
            padding: 0.5rem 0 0.25rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
            letter-spacing: 0.04em;
        }

        .goal-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 2rem;
        }
        .goal-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--accent-color); }

        .goal-header {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .goal-date { font-size: 1.2rem; font-weight: 700; color: #e0f2fe; }
        .goal-actions { display: flex; gap: 0.5rem; }

        .goal-body { padding: 1.5rem; overflow-x: auto; }
        
        /* 테이블 스타일 */
        .goal-table {
            width: 100%;
            border-collapse: collapse;
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        .goal-table th, .goal-table td {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            text-align: left;
        }
        .goal-table th {
            background: rgba(255,255,255,0.05);
            font-weight: 600;
            color: var(--accent-color);
        }
        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-done { background: rgba(16,185,129,0.2); color: #34d399; }
        .status-todo { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .status-fail { background: rgba(239,68,68,0.2); color: #f87171; }

        /* 입력 폼 스타일 */
        .goal-form-table { width: 100%; margin-bottom: 1rem; }
        .goal-form-table th { font-size: 0.8rem; color: var(--text-secondary); padding-bottom: 0.5rem; text-align: left; }
        .goal-row-input { background: #1e293b; border: 1px solid #334155; color: white; padding: 0.5rem; border-radius: 4px; width: 100%; }
        .btn-add-row { background: transparent; border: 1px dashed var(--border-color); color: var(--text-secondary); width: 100%; padding: 0.5rem; cursor: pointer; margin-top: 0.5rem; border-radius: 4px; }
        .btn-add-row:hover { border-color: var(--accent-color); color: var(--accent-color); }
        
        .remove-row { color: #ef4444; cursor: pointer; background: none; border: none; font-size: 1.2rem; }
    </style>
</head>
<body>

<div id="listView">
    <div class="page-hero">
        <h1>Goal</h1>
        <p>나의 목표와 계획, 그리고 성취의 기록</p>
    </div>
    <div style="display:flex; justify-content:center; gap:0.75rem; padding:0.75rem 1rem 0; flex-wrap:wrap;">
        <a href="index.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">← Home</a>
        <a href="study.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Study</a>
        <a href="project.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Project</a>
        <a href="article.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Article</a>
        <a href="certificate.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Certificate</a>
        <a href="diary.html" class="btn btn-secondary" style="font-size:0.9rem; padding:0.55rem 1.4rem;">Diary</a>
    </div>
    <div id="goalList" style="max-width:1000px; margin:2rem auto 4rem; padding:0 1.5rem;"></div>
</div>

<!-- 글쓰기 모달 -->
<div class="write-overlay" id="writeOverlay">
    <div class="write-modal" style="max-width: 900px;">
        <div class="write-modal-header">
            <h2 id="writeModalTitle">🎯 새 목표 계획</h2>
            <button class="write-modal-close" onclick="closeWrite()">&#10005;</button>
        </div>

        <div class="wm-row">
            <div style="flex: 1;">
                <label class="wm-label">날짜 *</label>
                <input id="gDate" type="date" class="wm-input">
            </div>
            <div style="flex: 2;">
                <label class="wm-label">오늘의 다짐</label>
                <input id="gTitle" type="text" class="wm-input" placeholder="오늘의 주요 목표나 다짐을 적어주세요.">
            </div>
        </div>

        <label class="wm-label">세부 계획 (항목, 세부내용, 시간, 수행시간)</label>
        <div style="overflow-x: auto;">
            <table class="goal-form-table">
                <thead>
                    <tr>
                        <th style="width: 20%;">항목</th>
                        <th style="width: 35%;">세부내용</th>
                        <th style="width: 15%;">계획시간</th>
                        <th style="width: 15%;">수행시간</th>
                        <th style="width: 10%;">상태</th>
                        <th style="width: 5%;"></th>
                    </tr>
                </thead>
                <tbody id="goalRows">
                    <!-- 행이 동적으로 추가됨 -->
                </tbody>
            </table>
        </div>
        <button type="button" class="btn-add-row" onclick="addGoalRow()">+ 항목 추가</button>

        <div style="margin-top: 1.5rem;">
            <label class="wm-label">회고 및 메모</label>
            <textarea id="gMemo" class="wm-textarea" rows="3" placeholder="오늘 하루를 되돌아보며..."></textarea>
        </div>

        <button class="wm-submit" id="publishBtn" onclick="publishGoal()">📤 GitHub에 등록</button>
    </div>
</div>

<!-- 토큰 설정 모달 -->
<div class="write-overlay" id="tokenOverlay">
    <div class="write-modal" style="max-width:480px;">
        <div class="write-modal-header">
            <h2>🔑 GitHub Token 설정</h2>
            <button class="write-modal-close" onclick="closeTokenModal()">&#10005;</button>
        </div>
        <p style="font-size:0.9rem; color:#94a3b8; margin-bottom:1.5rem; line-height:1.6;">
            GitHub에 데이터를 저장하려면 Personal Access Token이 필요합니다.
        </p>
        <input id="tokenInput" type="password" class="wm-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        <button class="wm-submit" onclick="saveToken()">💾 저장</button>
    </div>
</div>

<div class="fab-group">
    <button class="fab fab-token" onclick="openTokenModal()" title="GitHub Token 설정">🔑</button>
    <button class="fab fab-write" onclick="openWrite()" title="새 목표 작성">🎯</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════
   데이터 및 초기화
════════════════════════════════════════════ */
let GOALS = [];
let editingId = null;

const GITHUB_CONFIG = {
    owner: 'gansaw',
    repo: 'website',
    path: 'goal.html'
};
    

async function loadGoals() {
    try {
        const res = await fetch(location.href + '?v=' + Date.now());
        const text = await res.text();
        const startMarker = '<!--__GOAL_DATA' + '_START__';
        const endMarker   = '__GOAL_DATA' + '_END__-->';
        const startIdx = text.indexOf(startMarker);
        const endIdx   = text.indexOf(endMarker);
        if (startIdx !== -1 && endIdx !== -1) {
            const jsonStr = text.substring(startIdx + startMarker.length, endIdx).trim();
            try { GOALS = JSON.parse(jsonStr); } catch(e) { console.error("JSON Parse Error", e); GOALS = []; }
        }
    } catch(e) { console.error(e); }
}

/* ════════════════════════════════════════════
   UI 렌더링
════════════════════════════════════════════ */
function renderGoals() {
    const list = document.getElementById('goalList');
    if (GOALS.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:var(--text-secondary); padding:4rem 0;">등록된 목표가 없습니다. 첫 목표를 작성해보세요!</div>';
        return;
    }

    // 날짜순 정렬 (최신순)
    const sorted = [...GOALS].sort((a, b) => new Date(b.date) - new Date(a.date));
    
    let html = '';
    let lastMonth = '';

    sorted.forEach(g => {
        const dateObj = new Date(g.date);
        const monthStr = `${dateObj.getFullYear()}년 ${dateObj.getMonth() + 1}월`;
        
        if (monthStr !== lastMonth) {
            html += `<div class="goal-month-header">${monthStr}</div>`;
            lastMonth = monthStr;
        }

        html += `
        <div class="goal-card">
            <div class="goal-header">
                <div class="goal-date">${g.date} ${g.title ? `- ${g.title}` : ''}</div>
                <div class="goal-actions">
                    <button class="edit-btn" onclick="openEdit('${g.id}')">Edit</button>
                    <button class="delete-btn" onclick="deleteGoal('${g.id}')">Delete</button>
                </div>
            </div>
            <div class="goal-body">
                <table class="goal-table">
                    <thead>
                        <tr>
                            <th>항목</th>
                            <th>세부내용</th>
                            <th>계획시간</th>
                            <th>수행시간</th>
                            <th>상태</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${g.items.map(item => `
                            <tr>
                                <td>${item.task}</td>
                                <td>${item.desc}</td>
                                <td>${item.planTime}</td>
                                <td>${item.actualTime}</td>
                                <td><span class="status-badge status-${item.status}">${getStatusLabel(item.status)}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                ${g.memo ? `<div style="margin-top:1rem; font-size:0.85rem; color:var(--text-secondary); border-top:1px solid var(--border-color); padding-top:0.5rem;"><strong>Memo:</strong> ${g.memo}</div>` : ''}
            </div>
        </div>`;
    });
    list.innerHTML = html;
}

function getStatusLabel(status) {
    const labels = { 'done': '완료', 'todo': '진행중', 'fail': '미달성' };
    return labels[status] || status;
}

/* ════════════════════════════════════════════
   행 추가/삭제
════════════════════════════════════════════ */
function addGoalRow(data = {task:'', desc:'', planTime:'', actualTime:'', status:'todo'}) {
    const tbody = document.getElementById('goalRows');
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td><input type="text" class="goal-row-input task" value="${data.task}" placeholder="예: 운동"></td>
        <td><input type="text" class="goal-row-input desc" value="${data.desc}" placeholder="예: 스쿼트 100개"></td>
        <td><input type="text" class="goal-row-input planTime" value="${data.planTime}" placeholder="1시간"></td>
        <td><input type="text" class="goal-row-input actualTime" value="${data.actualTime}" placeholder="50분"></td>
        <td>
            <select class="goal-row-input status">
                <option value="todo" ${data.status==='todo'?'selected':''}>진행중</option>
                <option value="done" ${data.status==='done'?'selected':''}>완료</option>
                <option value="fail" ${data.status==='fail'?'selected':''}>미달성</option>
            </select>
        </td>
        <td><button class="remove-row" onclick="this.closest('tr').remove()">×</button></td>
    `;
    tbody.appendChild(tr);
}

/* ════════════════════════════════════════════
   모달 제어
════════════════════════════════════════════ */
function openWrite() {
    if (!getToken()) { showToast('먼저 🔑 버튼으로 GitHub Token을 설정해주세요.', true); setTimeout(openTokenModal, 1000); return; }
    editingId = null;
    document.getElementById('writeModalTitle').textContent = '🎯 새 목표 계획';
    document.getElementById('publishBtn').textContent = '📤 GitHub에 등록';
    document.getElementById('gDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('gTitle').value = '';
    document.getElementById('gMemo').value = '';
    document.getElementById('goalRows').innerHTML = '';
    addGoalRow();
    document.getElementById('writeOverlay').classList.add('active');
}

function openEdit(id) {
    const g = GOALS.find(x => String(x.id) === String(id));
    if (!g) return;
    editingId = id;
    document.getElementById('writeModalTitle').textContent = '✏️ 목표 수정';
    document.getElementById('publishBtn').textContent = '💾 GitHub에 저장';
    document.getElementById('gDate').value = g.date;
    document.getElementById('gTitle').value = g.title || '';
    document.getElementById('gMemo').value = g.memo || '';
    document.getElementById('goalRows').innerHTML = '';
    g.items.forEach(item => addGoalRow(item));
    document.getElementById('writeOverlay').classList.add('active');
}

function closeWrite() { document.getElementById('writeOverlay').classList.remove('active'); }

/* ════════════════════════════════════════════
   GitHub 연동 (CRUD)
════════════════════════════════════════════ */
async function publishGoal() {
    const date = document.getElementById('gDate').value;
    if (!date) { showToast('날짜를 선택해주세요.', true); return; }

    const rows = document.querySelectorAll('#goalRows tr');
    const items = Array.from(rows).map(tr => ({
        task: tr.querySelector('.task').value.trim(),
        desc: tr.querySelector('.desc').value.trim(),
        planTime: tr.querySelector('.planTime').value.trim(),
        actualTime: tr.querySelector('.actualTime').value.trim(),
        status: tr.querySelector('.status').value
    })).filter(item => item.task);

    if (items.length === 0) { showToast('최소 하나 이상의 항목을 입력해주세요.', true); return; }

    const token = getToken();
    const btn = document.getElementById('publishBtn');
    btn.disabled = true;
    btn.textContent = '⏳ 저장 중...';

    try {
        const goalData = {
            id: editingId || ('g' + Date.now()),
            date,
            title: document.getElementById('gTitle').value.trim(),
            memo: document.getElementById('gMemo').value.trim(),
            items
        };

        const { content: b64, sha } = await ghGet(token);
        const fileText = decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));

        let newGoals;
        if (editingId) {
            newGoals = GOALS.map(g => String(g.id) === String(editingId) ? goalData : g);
        } else {
            newGoals = [goalData, ...GOALS];
        }

        const newFile = injectJSON(fileText, JSON.stringify(newGoals));
        await ghPut(token, sha, newFile, `🎯 ${editingId ? 'Edit' : 'Add'} goal: ${date}`);

        showToast('✅ 저장되었습니다! 잠시 후 업데이트됩니다.');
        closeWrite();
        setTimeout(() => location.reload(), 2500);
    } catch (err) {
        showToast('❌ ' + err.message, true);
    } finally {
        btn.disabled = false;
    }
}

async function deleteGoal(id) {
    if (!confirm('이 기록을 삭제할까요?')) return;
    const token = getToken();
    showToast('⏳ 삭제 중...');
    try {
        const { content: b64, sha } = await ghGet(token);
        const fileText = decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
        const newGoals = GOALS.filter(g => String(g.id) !== String(id));
        const newFile = injectJSON(fileText, JSON.stringify(newGoals));
        await ghPut(token, sha, newFile, `🗑 Delete goal: ${id}`);
        showToast('🗑 삭제되었습니다.');
        setTimeout(() => location.reload(), 2500);
    } catch (err) {
        showToast('❌ ' + err.message, true);
    }
}

/* ════════════════════════════════════════════
   유틸리티 함수 (GitHub API 등)
════════════════════════════════════════════ */
function getToken() { return localStorage.getItem('gh_token_portfolio'); }
function saveToken() {
    const val = document.getElementById('tokenInput').value.trim();
    if (val) { localStorage.setItem('gh_token_portfolio', val); closeTokenModal(); showToast('🔑 토큰이 저장되었습니다.'); }
}
function openTokenModal() { 
    document.getElementById('tokenInput').value = getToken() || '';
    document.getElementById('tokenOverlay').classList.add('active'); 
}
function closeTokenModal() { document.getElementById('tokenOverlay').classList.remove('active'); }

async function ghGet(token) {
    const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
    const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
    if (!res.ok) throw new Error('파일을 불러오지 못했습니다.');
    return res.json();
}

async function ghPut(token, sha, content, message) {
    const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
    const res = await fetch(url, {
        method: 'PUT',
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(content))), sha })
    });
    if (!res.ok) throw new Error('저장에 실패했습니다.');
}

function injectJSON(html, json) {
    const startMarker = '<!--__GOAL_DATA' + '_START__';
    const endMarker   = '__GOAL_DATA' + '_END__-->';
    const startIdx = html.indexOf(startMarker);
    const endIdx   = html.indexOf(endMarker);
    return html.substring(0, startIdx + startMarker.length) + "\n" + json + "\n" + html.substring(endIdx);
}

function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

// 초기 실행
loadGoals().then(() => renderGoals());
